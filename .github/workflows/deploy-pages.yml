name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_deployed:
        description: Confirm matching Firestore rules, indexes, and Functions are already deployed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://throughthewall.ca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: backend_changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BACKEND_DEPLOYED: ${{ inputs.backend_deployed }}
        run: |
          hold_hosting=false
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- firestore.rules firestore.indexes.json firebase.json functions; then
              hold_hosting=true
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$BACKEND_DEPLOYED" != "true" ]; then
            hold_hosting=true
          fi
          echo "hold_hosting=$hold_hosting" >> "$GITHUB_OUTPUT"
      - if: steps.backend_changes.outputs.hold_hosting == 'true'
        run: echo "Hosting held. Deploy the matching backend, then dispatch this workflow with backend_deployed=true."
      - id: auth
        if: steps.backend_changes.outputs.hold_hosting != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: lib-oauth
          workload_identity_provider: projects/737647208245/locations/global/workloadIdentityPools/github-actions/providers/libapp
          service_account: github-firebase-hosting@lib-oauth.iam.gserviceaccount.com
      - if: steps.backend_changes.outputs.hold_hosting != 'true'
        run: npx firebase deploy --only hosting --project lib-oauth --non-interactive
