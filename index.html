<style>
:root{
  --ink:#351323; --wine:#431127; --wine-deep:#290817; --rose:#ed0c72;
  --purple:#7b2ee5;
  --gold:#7b2ee5; --gold-soft:#c8a9ff; --blush:#ffd0e3; --blush-soft:#fce7ef;
  --cream:#f8f3ef; --card:#fffaf7; --line:#efd7df; --miss:#9b5b6b;
  --muted:#806b70; --soft-text:#9a8589; --surface:#fff; --surface-soft:#fff5f7;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f8e9ee; --wine:#f3dbe4; --wine-deep:#fff4f7; --rose:#e78cab;
  --purple:#b98cff;
  --gold:#f2c85f; --gold-soft:#f7df96; --blush:#71334c; --blush-soft:#3a1b29;
  --cream:#170a11; --card:#25131c; --line:#5b2d41; --miss:#c898a7;
  --muted:#c6a8b3; --soft-text:#a98794; --surface:#211019; --surface-soft:#301722;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
body{
  background:
    radial-gradient(1100px 560px at 85% -8%, #fce2eb 0%, transparent 60%),
    radial-gradient(900px 520px at -10% 8%, #f7e9e2 0%, transparent 55%),
    radial-gradient(760px 620px at -12% 48%, rgba(255,184,213,.3) 0%, transparent 68%),
    radial-gradient(760px 620px at 112% 54%, rgba(188,148,255,.22) 0%, transparent 68%),
    var(--cream);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:760px;margin:0 auto;padding:18px 18px 96px}
.hdr{text-align:center;padding:10px 0 0;position:relative}
.brand-logo{display:block;width:min(100%,500px);height:auto;margin:0 auto -2px}
.eyebrow{letter-spacing:.35em;font-size:11px;font-weight:600;color:var(--rose);text-transform:uppercase}
.hdr h1{font-family:'Playfair Display',Georgia,serif;font-size:34px;line-height:1.1;margin:8px 0 6px;color:var(--wine)}
.seasonpill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--wine);background:linear-gradient(135deg,var(--blush-soft),#f5d7e4);padding:4px 14px;border-radius:999px}
.stepper{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;margin:24px 0 18px;padding:0 4px}
.stepper::before{content:"";position:absolute;z-index:0;left:12.5%;right:12.5%;top:23px;height:1.5px;background:linear-gradient(90deg,#ec9fc0 0%,#cba4ea 46%,#d7b969 72%,#b996a4 100%)}
.step{--step-accent:#bfa7af;position:relative;z-index:1;display:grid;grid-template-rows:48px auto;place-items:center;min-width:0;padding:0 5px;color:#bba2aa}
.step:nth-child(1){--step-accent:var(--rose)}
.step:nth-child(2){--step-accent:var(--purple)}
.step:nth-child(3){--step-accent:#bd8a1c}
.step:nth-child(4){--step-accent:var(--wine)}
.step-icon{position:relative;width:46px;height:46px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--step-accent) 38%,var(--line));border-radius:50%;background:var(--card);color:var(--step-accent);font:700 22px/1 'Playfair Display',Georgia,serif;box-shadow:0 4px 14px rgba(67,17,39,.06)}
.step-icon svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.step.done .step-icon{background:color-mix(in srgb,var(--step-accent) 10%,var(--card))}
.step.done .step-icon::after{content:"✓";position:absolute;right:-2px;bottom:-1px;width:17px;height:17px;display:grid;place-items:center;border:2px solid var(--cream);border-radius:50%;background:var(--step-accent);color:#fff;font:800 9px/1 Inter,sans-serif}
.step.cur .step-icon{border-color:var(--step-accent);background:var(--step-accent);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--step-accent) 12%,transparent),0 7px 18px color-mix(in srgb,var(--step-accent) 22%,transparent)}
.step-label{margin-top:8px;font-size:9.5px;font-weight:800;letter-spacing:.08em;line-height:1.25;text-align:center;text-transform:uppercase}
.step.done .step-label,.step.cur .step-label{color:var(--wine)}
.phase-hero{--phase-accent:var(--rose);position:relative;overflow:hidden;margin:4px 0 18px;padding:28px 24px 23px;border:1px solid color-mix(in srgb,var(--phase-accent) 18%,var(--line));border-radius:18px;background:radial-gradient(circle at 92% 4%,color-mix(in srgb,var(--phase-accent) 10%,transparent),transparent 32%),linear-gradient(135deg,color-mix(in srgb,var(--blush-soft) 62%,var(--card)),var(--card));text-align:center}
.phase-hero.phase-dating{--phase-accent:var(--purple)}
.phase-hero.phase-weddings{--phase-accent:#b68419}
.phase-hero.phase-reunion{--phase-accent:var(--wine)}
.phase-hero-kicker{display:block;margin-bottom:7px;color:var(--phase-accent);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.phase-hero h2{margin:0;color:var(--wine);font:700 clamp(29px,5vw,40px)/1.05 'Playfair Display',Georgia,serif}
.phase-hero-rule{display:flex;align-items:center;justify-content:center;gap:10px;width:min(260px,70%);margin:12px auto 9px;color:#c59a35}
.phase-hero-rule::before,.phase-hero-rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#d9b85e)}
.phase-hero-rule::after{background:linear-gradient(90deg,#d9b85e,transparent)}
.phase-hero-rule span{font-size:14px}
.phase-hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.season-progress-scale,.season-progress-row{display:grid;grid-template-columns:minmax(88px,126px) 1fr;gap:10px;align-items:center}
.season-progress-scale{margin:13px 0 8px}
.season-progress-phases,.season-progress-track{display:flex;min-width:0}
.season-progress-phase{min-width:0;text-align:center;color:var(--soft-text);font-size:8px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.season-progress-row{padding:8px 0;border-top:1px solid var(--line)}
.season-progress-name{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.season-progress-track{position:relative;height:12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.season-progress-segment{min-width:0;border-right:1px solid color-mix(in srgb,var(--wine) 18%,transparent)}
.season-progress-segment:last-child{border-right:none}
.season-progress-segment:nth-child(1){background:color-mix(in srgb,var(--rose) 13%,transparent);border-radius:999px 0 0 999px}
.season-progress-segment:nth-child(2){background:color-mix(in srgb,var(--gold) 14%,transparent)}
.season-progress-segment:nth-child(3){background:color-mix(in srgb,var(--wine) 10%,transparent)}
.season-progress-segment:nth-child(4){background:color-mix(in srgb,var(--muted) 10%,transparent);border-radius:0 999px 999px 0}
.season-progress-marker{position:absolute;top:50%;width:20px;height:20px;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%;background:var(--wine);color:#fff;border:2px solid var(--card);box-shadow:0 2px 7px rgba(67,17,39,.25);font-size:9px;line-height:1}
.season-progress-status{grid-column:2;color:var(--muted);font-size:10.5px;line-height:1.25;margin-top:-5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px;margin:14px 0;box-shadow:0 9px 25px rgba(110,31,59,.055)}
.phase-board{--phase-accent:var(--rose);position:relative;border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,color-mix(in srgb,var(--phase-accent) 68%,#fff),color-mix(in srgb,var(--purple) 44%,var(--line))) border-box;box-shadow:0 12px 30px color-mix(in srgb,var(--phase-accent) 8%,transparent)}
.phase-board-dating{--phase-accent:var(--purple)}
.phase-board-weddings{--phase-accent:#b68419}
.phase-board-reunion{--phase-accent:var(--wine)}
.board-window-title{display:flex;align-items:center;gap:8px;margin:0 0 5px!important;color:var(--phase-accent)!important;font:800 10px/1.3 Inter,sans-serif!important;letter-spacing:.12em;text-transform:uppercase}
.board-window-title::before{content:"";width:22px;height:1px;background:currentColor}
#pool-panel-play{position:relative;isolation:isolate}
#pool-panel-play::before,#pool-panel-play::after{content:"";position:absolute;z-index:-1;pointer-events:none;filter:blur(2px);opacity:.62}
#pool-panel-play::before{left:-180px;top:230px;width:360px;height:560px;background:radial-gradient(ellipse at center,rgba(255,153,197,.36),rgba(255,205,225,.16) 47%,transparent 72%)}
#pool-panel-play::after{right:-190px;top:360px;width:370px;height:570px;background:radial-gradient(ellipse at center,rgba(174,124,249,.27),rgba(217,190,255,.12) 48%,transparent 72%)}
.card h2{font-family:'Playfair Display',Georgia,serif;color:var(--wine);font-size:23px;margin:0 0 4px}
.card h3{font-family:'Playfair Display',Georgia,serif;color:var(--wine);font-size:18px;margin:0 0 8px}
.lede{color:var(--muted);font-size:14px;line-height:1.55;margin:4px 0 0}
.btn-primary{display:block;width:100%;padding:15px 18px;margin-top:14px;border:none;border-radius:14px;color:#fff;font-weight:700;font-size:16px;font-family:Inter,sans-serif;cursor:pointer;background:linear-gradient(135deg,#d90068,#ed0c72 55%,#f4378f);box-shadow:0 10px 26px rgba(220,0,99,.24);transition:filter .15s,transform .1s}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn-secondary{display:block;width:100%;padding:13px 18px;margin-top:10px;border:1.5px solid var(--wine);border-radius:14px;color:var(--wine);font-weight:700;font-size:15px;font-family:Inter,sans-serif;cursor:pointer;background:none}
.btn-secondary:hover{background:var(--blush-soft)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 18px;margin-top:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;font-family:Inter,sans-serif;cursor:pointer;transition:box-shadow .15s,transform .1s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn-google:hover{box-shadow:0 4px 16px rgba(0,0,0,.13)}
.btn-google:active{transform:translateY(1px)}
.btn-add{padding:11px 16px;border:1.5px solid var(--wine);border-radius:12px;background:none;color:var(--wine);font-weight:700;font-size:14px;cursor:pointer;font-family:Inter,sans-serif}
.btn-add:disabled{opacity:.35;cursor:default}
.btn-confirm{border:none;color:#fff;background:linear-gradient(135deg,#d90068,#ed0c72 55%,#f4378f);box-shadow:0 7px 18px rgba(220,0,99,.2);transition:filter .15s,transform .1s}
.btn-confirm:hover{filter:brightness(1.06)}
.btn-confirm:active{transform:translateY(1px)}
.btn-confirm:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn-x{display:grid;place-items:center;flex:0 0 auto;min-width:44px;min-height:44px;border:none;background:none;color:#b08d95;font-size:16px;cursor:pointer;padding:8px}
.btn-small{padding:7px 14px;border:1.5px solid var(--wine);border-radius:10px;background:none;color:var(--wine);font-weight:700;font-size:13px;cursor:pointer;font-family:Inter,sans-serif}
.btn-small.filled{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn-small:disabled{opacity:.35;cursor:default}
.budget-card{--budget-accent:var(--rose);position:relative;margin:14px 0 10px;padding:15px 16px 14px 54px;border:1px solid color-mix(in srgb,var(--budget-accent) 26%,var(--line));border-radius:15px;background:linear-gradient(125deg,color-mix(in srgb,var(--budget-accent) 6%,var(--surface)),var(--surface));box-shadow:0 6px 18px color-mix(in srgb,var(--budget-accent) 7%,transparent)}
.budget-card.phase-dating{--budget-accent:var(--purple)}
.budget-card.phase-weddings{--budget-accent:#b68419}
.budget-card.phase-reunion{--budget-accent:var(--wine)}
.budget-card::before{content:"♥";position:absolute;left:15px;top:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--budget-accent) 12%,var(--card));color:var(--budget-accent);font:700 16px/1 Georgia,serif}
.budget-card.expiring{border-color:#d88923;background:color-mix(in srgb,#fff2d9 55%,var(--surface))}
.budget-card.carrying{border-color:color-mix(in srgb,var(--budget-accent) 34%,var(--line))}
.budgetrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.budgetrow .n{font-family:'Playfair Display',serif;font-size:22px;color:var(--wine)}
.budget-bar{height:10px;border-radius:999px;background:var(--blush-soft);overflow:hidden}
.budget-fill{height:100%;background:linear-gradient(90deg,var(--budget-accent),color-mix(in srgb,var(--budget-accent) 44%,#fff));transition:width .25s}
.budget-note{display:block;margin-top:7px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.02em}
.budget-card.expiring .budget-note{color:#8a5511}
.scoring-primer{margin:10px 0;padding:11px 13px;border:1px dashed color-mix(in srgb,var(--gold) 65%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--gold) 8%,var(--surface));color:var(--muted);font-size:12px;line-height:1.5}
.scoring-primer b{color:var(--wine)}
.guided-pick{margin:12px 0;padding:13px 14px;border:1px solid color-mix(in srgb,var(--rose) 42%,var(--line));border-radius:12px;background:linear-gradient(135deg,var(--blush-soft),var(--surface))}
.guided-pick-kicker{color:var(--rose);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.guided-pick p{margin:4px 0 0;color:var(--ink);font-size:13px;line-height:1.5}
.panel{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--surface)}
.phead{width:100%;text-align:left;background:var(--blush-soft);border:none;padding:12px 14px;font-weight:700;color:var(--wine);cursor:pointer;font-size:14px;font-family:Inter,sans-serif;display:flex;justify-content:space-between}
.pbody{padding:12px 14px;font-size:14px;line-height:1.6;color:var(--ink)}
.pbody ul{margin:6px 0;padding-left:18px}
.pbody li{margin:4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.field{flex:1;min-width:130px}
label.small{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--soft-text);display:block;margin-bottom:5px}
select,input[type=text],input[type=email]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:var(--ink);font-family:Inter,sans-serif}
input[type=range]{width:100%;accent-color:var(--rose)}
.stakebox{display:flex;align-items:center;gap:10px}
.stakeval{font-family:'Playfair Display',serif;font-size:24px;color:var(--wine);min-width:58px;text-align:center}
.points-preview{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.35}
.points-preview strong{color:var(--wine);font-family:'Playfair Display',Georgia,serif;font-size:15px;white-space:nowrap}
.pickchip{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:7px 0;background:var(--surface);text-align:left}
.pickchip>div{flex:1;min-width:0;text-align:left}
.pickchip .nm{font-weight:600;font-size:14px}
.locked-market-list{display:grid;gap:7px;margin:12px 0}
.locked-market{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--surface);color:var(--soft-text)}
.locked-market strong{color:var(--ink);font-size:14px}
.locked-market .lock-reason{text-align:right;font-size:12px}
.subtle{color:var(--soft-text);font-size:12px;line-height:1.45}
.results-group{margin:16px 0}
.results-group:first-of-type{margin-top:10px}
.results-group-title{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:'Playfair Display',Georgia,serif;font-size:20px}
.results-group-title.hits{color:#247344}
.results-group-title.misses{color:#a52c45}
.results-group-title.pending{color:#69559b}
.receipt{border-left:4px solid var(--gold);background:#fffaf1;padding:10px 13px;border-radius:0 10px 10px 0;margin:8px 0;font-variant-numeric:tabular-nums}
.receipt.miss{border-left-color:#c8576d;background:#fff0f2}
.receipt.pending{border-left-color:#b9a7dc;background:#f6f3fb}
.receipt.hit,.receipt.hit.pending{border-left-color:#3f9360;background:#edf8f1}
.receipt.hit .pts,.receipt.hit.pending .pts{color:#247344}
.receipt.retro{border-left-color:#7b2ee5;background:#f7f1ff}
.receipt .who{font-weight:700;font-size:14px}
.receipt .pts{float:right;font-family:'Playfair Display',serif;font-size:19px;color:var(--wine)}
.receipt.miss .pts{color:var(--miss);font-size:15px}
.math{font-size:12.5px;color:var(--muted);margin-top:3px;clear:both}
.other-outcomes{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.other-outcomes summary{cursor:pointer;color:var(--soft-text);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.other-outcomes-list{display:grid;gap:6px;margin-top:9px}
.outcome-compact{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--surface) 86%,var(--blush-soft));color:var(--muted);font-size:11.5px;line-height:1.4}
.outcome-compact strong{color:var(--ink);font-size:12px}
.evt{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:linear-gradient(180deg,#fff,#fdf5f6)}

.multpill{font-size:11px;font-weight:700;color:var(--wine);background:var(--blush-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.reunion-market{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:12px 0;background:linear-gradient(135deg,var(--surface-soft),var(--surface));box-shadow:0 4px 14px rgba(110,31,59,.04)}
.reunion-market-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}
.reunion-market-head h3{margin:0}
.reunion-market-caption{display:block;color:var(--muted);font-size:11px;line-height:1.35;margin-top:2px}
.reunion-market-multiplier{display:flex;align-items:baseline;gap:5px;flex:0 0 auto;padding:5px 10px;border:1px solid color-mix(in srgb,var(--rose) 35%,var(--line));border-radius:10px;background:var(--blush-soft);color:var(--wine)}
.reunion-market-multiplier strong{font-family:'Playfair Display',Georgia,serif;font-size:23px;line-height:1}
.reunion-market-multiplier span{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
.reunion-market-muted{background:var(--surface);box-shadow:none}
:root[data-theme="dark"] .reunion-market{background:linear-gradient(135deg,#3a1b29,var(--surface));box-shadow:0 5px 16px rgba(0,0,0,.16)}
:root[data-theme="dark"] .reunion-market-muted{background:var(--surface)}
.btn-settings{position:absolute;right:0;top:18px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--wine);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px rgba(67,17,39,.08)}
.btn-settings:hover{background:var(--blush-soft)}
.theme-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.theme-choice{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:13px 12px;font:600 14px Inter,sans-serif;cursor:pointer;text-align:left}
.theme-choice.active{border-color:var(--rose);box-shadow:0 0 0 2px color-mix(in srgb,var(--rose) 18%,transparent);color:var(--rose)}
.theme-choice span{display:block;font-size:20px;margin-bottom:5px}
.danger-zone{border:1px solid #d58a99;border-radius:14px;padding:14px;margin-top:18px;background:color-mix(in srgb,#d7375f 7%,var(--card))}
.danger-zone h3{color:#b93356;margin-top:0}
.danger-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.danger-row:last-child{border-bottom:none}
.pool-management-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:8px;width:min(100%,320px);margin-left:auto}
.pool-management-actions .btn-secondary,.pool-management-actions .btn-danger{display:grid;place-items:center;width:100%;min-height:34px;margin:0;padding:7px 9px;border-radius:9px;font-size:12px;line-height:1.2}
.danger-confirm{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.danger-confirm label{font-size:13px;color:var(--ink);display:block;margin-bottom:7px}
.btn-danger-wide{display:block;width:100%;padding:12px 14px;margin-top:10px;border:1px solid #c52d55;border-radius:12px;background:#b71f49;color:#fff;font:700 14px Inter,sans-serif;cursor:pointer}
.btn-danger-wide:disabled{opacity:.35;cursor:default}
.cast-board{padding:0;overflow:hidden;border-color:color-mix(in srgb,var(--wine) 13%,var(--line));box-shadow:0 6px 18px rgba(67,17,39,.035)}
.cast-slider-shell{display:grid;grid-template-columns:132px 34px minmax(0,1fr) 34px;align-items:center;gap:8px;padding:11px 12px;background:linear-gradient(100deg,color-mix(in srgb,var(--blush-soft) 42%,var(--surface)),var(--surface) 48%,color-mix(in srgb,var(--purple) 5%,var(--surface)))}
.cast-slider-title{align-self:stretch;border:0;border-right:1px solid var(--line);background:none;color:var(--wine);padding:4px 12px 4px 2px;text-align:left;cursor:pointer;font-family:Inter,sans-serif}
.cast-slider-title strong{display:block;font-family:'Playfair Display',Georgia,serif;font-size:16px;line-height:1.12}
.cast-slider-title span{display:block;margin-top:4px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.cast-slider-arrow{width:32px;height:32px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--wine) 20%,var(--line));border-radius:50%;background:color-mix(in srgb,var(--surface) 88%,var(--blush-soft));color:var(--wine);font:700 20px/1 Georgia,serif;cursor:pointer;transition:transform .15s,background .15s}
.cast-slider-arrow:hover{background:var(--blush-soft);transform:scale(1.04)}
.cast-slider-track{display:flex;align-items:flex-start;gap:10px;min-width:0;padding:3px 1px 5px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;scrollbar-width:none}
.cast-slider-track::-webkit-scrollbar{display:none}
.cast-slider-track>[role="listitem"]{flex:0 0 76px;min-width:0;scroll-snap-align:start}
.cast-reference-thumb{min-width:0;text-align:center;color:var(--ink)}
.cast-reference-avatar{position:relative;width:68px;height:68px;margin:0 auto;border:2px solid color-mix(in srgb,var(--rose) 26%,var(--line));border-radius:50%;overflow:visible;background:linear-gradient(145deg,#fee4ee,#f4cbd8);box-shadow:0 3px 10px rgba(67,17,39,.08)}
.cast-reference-thumb.man .cast-reference-avatar{border-color:color-mix(in srgb,var(--purple) 28%,var(--line));background:linear-gradient(145deg,#ece5ff,#d8d5f3)}
.cast-reference-thumb.engaged .cast-reference-avatar{box-shadow:0 0 0 2px color-mix(in srgb,var(--rose) 32%,transparent),0 4px 12px rgba(67,17,39,.1)}
.cast-reference-thumb.married .cast-reference-avatar{border-color:#c39229;box-shadow:0 0 0 2px color-mix(in srgb,#c39229 24%,transparent),0 4px 12px rgba(67,17,39,.1)}
.cast-reference-thumb.broken-up .cast-reference-avatar{border-color:#bd3652}
.cast-reference-avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.cast-reference-initials{height:100%;display:grid;place-items:center;overflow:hidden;border-radius:50%;color:var(--wine);font:700 19px/1 'Playfair Display',Georgia,serif}
.cast-reference-name{display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:700}
.cast-reference-status{position:absolute;right:-3px;bottom:1px;width:20px;height:20px;display:grid;place-items:center;border:3px solid var(--card);border-radius:50%;background:var(--rose);color:#fff;font-size:8px;font-weight:900;box-shadow:0 2px 5px rgba(67,17,39,.16)}
.cast-reference-thumb.married .cast-reference-status{background:#a67518}
.cast-reference-thumb.broken-up .cast-reference-status{background:#b3263e}
.cast-board-head{width:100%;border:none;background:linear-gradient(135deg,color-mix(in srgb,var(--blush-soft) 58%,var(--surface)),var(--surface));color:var(--wine);padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;cursor:pointer;font-family:Inter,sans-serif}
.cast-board-head strong{display:block;font-family:'Playfair Display',Georgia,serif;font-size:21px}
.cast-board-head span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.cast-board-toggle{font-size:22px;font-weight:500;color:var(--rose);line-height:1}
.cast-board-body{padding:14px 16px 17px}
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:11px}
.cast-couples-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cast-couple{min-width:0;border:1px solid color-mix(in srgb,var(--rose) 45%,var(--line));border-radius:15px;padding:9px;background:color-mix(in srgb,var(--blush-soft) 45%,var(--surface))}
.cast-couple-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.cast-couple-label{text-align:center;color:var(--wine);font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:700;padding:8px 3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast-section-title{font-family:'Playfair Display',Georgia,serif;font-size:17px;color:var(--wine);margin:0 0 9px}
.cast-section-title.other{margin-top:18px}
.cast-person{min-width:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface);position:relative}
.cast-person.engaged{border-color:color-mix(in srgb,var(--rose) 55%,var(--line));box-shadow:0 0 0 2px color-mix(in srgb,var(--rose) 10%,transparent)}
.cast-person.married{border-color:color-mix(in srgb,var(--gold) 72%,var(--line));box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 18%,transparent)}
.cast-person.broken-up{border-color:#c9344f;box-shadow:0 0 0 2px color-mix(in srgb,#c9344f 14%,transparent)}
.cast-photo{aspect-ratio:4/5;background:linear-gradient(145deg,var(--blush-soft),var(--line));display:grid;place-items:center;overflow:hidden}
.cast-photo img{display:block;width:100%;height:100%;object-fit:cover}
.cast-initials{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;color:var(--wine);letter-spacing:.02em}
.cast-person-name{font-size:12px;font-weight:700;color:var(--ink);padding:8px 7px 9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast-status{position:absolute;top:7px;right:7px;background:rgba(67,17,39,.88);color:#fff;font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 6px;border-radius:999px}
.cast-status.married{background:#a67518;color:#fff}
.cast-status.broken-up{background:#b3263e;color:#fff}
.chemistry-hero{position:relative;overflow:hidden;padding:26px 22px;border:1px solid color-mix(in srgb,var(--rose) 24%,var(--line));border-radius:20px;background:radial-gradient(circle at 88% 10%,color-mix(in srgb,var(--purple) 18%,transparent),transparent 34%),radial-gradient(circle at 9% 92%,color-mix(in srgb,var(--rose) 16%,transparent),transparent 38%),linear-gradient(135deg,color-mix(in srgb,var(--blush-soft) 68%,var(--card)),var(--card));text-align:center;box-shadow:0 12px 30px rgba(110,31,59,.07)}
.chemistry-kicker{display:block;color:var(--rose);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.chemistry-hero h2{margin:7px 0 6px;color:var(--wine);font:700 clamp(29px,6vw,42px)/1.04 'Playfair Display',Georgia,serif}
.chemistry-hero p{max-width:530px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.55}
.chemistry-orbit{position:absolute;border:1px solid color-mix(in srgb,var(--rose) 28%,transparent);border-radius:50%;pointer-events:none}
.chemistry-orbit.one{width:110px;height:110px;right:-42px;bottom:-58px}
.chemistry-orbit.two{width:62px;height:62px;right:-17px;bottom:-33px}
.chemistry-segmented{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:14px 0;padding:5px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--blush-soft) 42%,var(--surface))}
.chemistry-segmented.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.chemistry-tea-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}
.chemistry-tea-tabs.global{grid-template-columns:repeat(2,minmax(0,1fr))}
.chemistry-segmented button{min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--muted);font:800 12px/1.2 Inter,sans-serif;cursor:pointer}
.chemistry-segmented button.active{background:var(--surface);color:var(--wine);box-shadow:0 3px 11px rgba(67,17,39,.09)}
.chemistry-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0}
.chemistry-toolbar .field{min-width:145px}
.chemistry-progress{display:flex;align-items:center;gap:11px;margin:13px 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.chemistry-progress-ring{--progress:0;width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:conic-gradient(var(--rose) calc(var(--progress)*1%),var(--blush-soft) 0);position:relative;color:var(--wine);font-size:10px;font-weight:900}
.chemistry-progress-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.chemistry-progress-ring span{position:relative}
.chemistry-progress strong{display:block;color:var(--wine);font-size:13px}
.chemistry-progress small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.4}
.rating-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rating-card{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:0 6px 18px rgba(67,17,39,.04)}
.rating-card-head{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:11px;padding:10px 12px;background:linear-gradient(120deg,color-mix(in srgb,var(--blush-soft) 42%,var(--surface)),var(--surface))}
.cast-flag-picker{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 13px 12px}.cast-flag-picker button{padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font:800 10px Inter,sans-serif;cursor:pointer}.cast-flag-picker button.active.red{border-color:#c94a62;background:#fff0f2;color:#9f243e}.cast-flag-picker button.active.green{border-color:#3f9360;background:#edf8f1;color:#247344}:root[data-theme="dark"] .cast-flag-picker button.active.red{background:#4d202b;color:#ffb5c3}:root[data-theme="dark"] .cast-flag-picker button.active.green{background:#193c29;color:#a9e7bc}
.rating-card-photo{width:76px;height:76px;overflow:hidden;border-radius:13px;background:linear-gradient(145deg,var(--blush-soft),var(--line));display:grid;place-items:center}
.rating-card-photo img{width:100%;height:100%;object-fit:cover}
.rating-card-photo span{color:var(--wine);font:700 23px/1 'Playfair Display',Georgia,serif}
.rating-card-name{min-width:0;color:var(--wine);font:700 20px/1.1 'Playfair Display',Georgia,serif;overflow:hidden;text-overflow:ellipsis}
.rating-card-meta{margin-top:4px;color:var(--soft-text);font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.rating-overall{min-width:46px;text-align:center}
.rating-overall strong{display:block;color:var(--rose);font:700 24px/1 'Playfair Display',Georgia,serif}
.rating-overall span{color:var(--soft-text);font-size:9px;font-weight:800}
.rating-rows{padding:7px 12px 11px}
.rating-row{display:grid;grid-template-columns:92px minmax(110px,1fr) 48px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 62%,transparent)}
.rating-row:last-child{border-bottom:0}
.rating-label{color:var(--ink);font-size:11px;font-weight:800}
.rating-label span{margin-right:4px}
.rating-slider{min-width:0}
.rating-slider input{width:100%;height:22px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
.rating-slider input::-webkit-slider-runnable-track{height:7px;border-radius:99px;background:linear-gradient(90deg,var(--rose) 0 var(--rating-progress),var(--blush-soft) var(--rating-progress) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rose) 18%,var(--line))}
.rating-slider input::-moz-range-track{height:7px;border-radius:99px;background:linear-gradient(90deg,var(--rose) 0 var(--rating-progress),var(--blush-soft) var(--rating-progress) 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rose) 18%,var(--line))}
.rating-slider input::-webkit-slider-thumb{width:21px;height:21px;margin-top:-7px;appearance:none;-webkit-appearance:none;border:3px solid var(--surface);border-radius:50%;background:var(--rose);box-shadow:0 2px 8px color-mix(in srgb,var(--rose) 38%,transparent)}
.rating-slider input::-moz-range-thumb{width:17px;height:17px;border:3px solid var(--surface);border-radius:50%;background:var(--rose);box-shadow:0 2px 8px color-mix(in srgb,var(--rose) 38%,transparent)}
.rating-slider input.unrated{opacity:.48}
.rating-slider input:focus-visible{outline:3px solid color-mix(in srgb,var(--purple) 28%,transparent);outline-offset:3px;border-radius:99px}
.rating-slider-scale{display:flex;justify-content:space-between;margin-top:-1px;color:var(--soft-text);font-size:7px;font-weight:800}
.rating-value{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:right}.rating-value strong{color:var(--rose);font:700 20px/1 'Playfair Display',Georgia,serif}.rating-value span{align-self:end;margin:0 0 2px 2px;color:var(--soft-text);font-size:7px;font-weight:900}.rating-value button{grid-column:1/-1;justify-self:end;margin-top:2px;padding:0;border:0;background:transparent;color:var(--soft-text);font-size:9px;font-weight:900;cursor:pointer}.rating-value button:hover{color:var(--rose)}
.chemistry-privacy{display:flex;gap:11px;align-items:flex-start;margin:16px 0;padding:14px;border:1px solid color-mix(in srgb,var(--purple) 26%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--purple) 6%,var(--surface))}
.chemistry-privacy-icon{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:11px;background:color-mix(in srgb,var(--purple) 13%,var(--surface));color:var(--purple);font-size:17px}
.chemistry-privacy strong{display:block;color:var(--wine);font-size:13px}
.chemistry-privacy p{margin:3px 0 0;color:var(--muted);font-size:11.5px;line-height:1.45}
.chemistry-toggle{display:flex;align-items:flex-start;gap:11px;margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.chemistry-toggle input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--rose);flex:0 0 auto}
.chemistry-toggle strong{display:block;color:var(--wine);font-size:13px}
.chemistry-toggle span{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.45}
.notification-options{display:grid;gap:9px;margin:12px 0 6px}
.notification-options .chemistry-toggle{margin:0;padding:12px 14px}
.notification-destination{margin:9px 0 18px;color:var(--muted);font-size:11.5px;line-height:1.45}
.chemistry-savebar{position:sticky;z-index:4;bottom:12px;margin:18px 0 4px;padding:10px;border:1px solid color-mix(in srgb,var(--rose) 26%,var(--line));border-radius:17px;background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:0 12px 34px rgba(67,17,39,.15);backdrop-filter:blur(12px)}
.chemistry-savebar .btn-primary{margin:0}
.chemistry-empty{padding:30px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface) 72%,var(--blush-soft))}
.chemistry-empty-icon{font-size:35px}
.chemistry-empty h3{margin:8px 0 4px}
.chemistry-empty p{max-width:430px;margin:0 auto;color:var(--muted);font-size:12px;line-height:1.5}
.chemistry-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin:18px 0 16px}
.chemistry-podium .podium-place{min-width:0;text-align:center;padding:13px 7px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.chemistry-podium .podium-place.first{order:2;padding-top:20px;border-color:color-mix(in srgb,#c39229 62%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,#f2c85f 14%,var(--surface)),var(--surface));transform:translateY(-8px)}
.chemistry-podium .podium-place.second{order:1}.chemistry-podium .podium-place.third{order:3}
.chemistry-podium .podium-medal{font-size:18px}.podium-photo{width:58px;height:58px;margin:6px auto;overflow:hidden;border-radius:50%;background:var(--blush-soft);display:grid;place-items:center;color:var(--wine);font:700 17px/1 'Playfair Display',Georgia,serif}
.podium-photo img{width:100%;height:100%;object-fit:cover}
.chemistry-podium .podium-place strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--wine);font:700 15px/1.15 'Playfair Display',Georgia,serif}
.chemistry-podium .podium-place small{display:block;margin-top:4px;color:var(--rose);font-size:11px;font-weight:900}
.leaderboard-list{display:grid;gap:7px}
.leaderboard-row{display:grid;grid-template-columns:28px 45px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.leaderboard-row.expandable{grid-template-columns:28px 45px minmax(0,1fr) auto 24px;cursor:pointer;transition:border-color .16s ease,background .16s ease,transform .16s ease}
.leaderboard-row.expandable:hover{border-color:color-mix(in srgb,var(--rose) 42%,var(--line));background:color-mix(in srgb,var(--blush-soft) 32%,var(--surface))}
.leaderboard-row.expandable:focus-visible{outline:3px solid color-mix(in srgb,var(--purple) 32%,transparent);outline-offset:2px}
.leaderboard-row.expandable.open{border-color:color-mix(in srgb,var(--purple) 44%,var(--line));border-radius:13px 13px 6px 6px;background:color-mix(in srgb,var(--purple) 5%,var(--surface))}
.leaderboard-rank{text-align:center;color:var(--soft-text);font-size:11px;font-weight:900}
.leaderboard-avatar{width:45px;height:45px;overflow:hidden;border-radius:11px;background:var(--blush-soft);display:grid;place-items:center;color:var(--wine);font:700 13px/1 'Playfair Display',Georgia,serif}

      const row=rows.get(key)||{name:entry.name,gender:entry.gender,totals:{},counts:{}};
      row.name=entry.name;row.gender=entry.gender||row.gender;
      Object.entries(ratingMetrics(entry)).forEach(([metric,value])=>{
        row.totals[metric]=Math.max(0,(Number(row.totals[metric])||0)+direction*value);
        row.counts[metric]=Math.max(0,(Number(row.counts[metric])||0)+direction);
      });
      rows.set(key,row);
    });
  };
  apply(previousRatings,-1);
  apply(nextRatings,1);
  return [...rows.values()].filter(row=>Object.values(row.counts).some(count=>count>0)).sort((a,b)=>a.name.localeCompare(b.name));
};

    const editablePhases=Array.isArray(predictionPhases)
      ? [...new Set(predictionPhases.filter(phase=>GAME_PHASES.includes(phase)))]
      : [activePhase];

  loadAllPlayers: async (poolId, currentUid, globalPool=false) => {
    const toPlayer = d => {
      const {picks:legacyPicks={},...publicState}=d.data();
      return {...publicState,picks:{
        pods:Array.isArray(legacyPicks.pods)?legacyPicks.pods:[],
        dating:Array.isArray(legacyPicks.dating)?legacyPicks.dating:[],
        weddings:Array.isArray(legacyPicks.weddings)?legacyPicks.weddings:[],
        reunion:Array.isArray(legacyPicks.reunion)?legacyPicks.reunion:[],
      }};

        if (own.exists()) players[currentUid]=toPlayer(own);
      }

      try {
        const statusSnap = await getDoc(doc(db,'pools',poolId,'phaseStatus',phase));

        const completedMembers=phaseStatusData?.completedMembers||[];

        if (viewerCompleted && completedMembers.length) {
          // Live checkpoints use only immutable picks belonging to players who
          // individually locked them. In friend pools, those picks stay hidden
          // until the viewer completes the same phase.
          await Promise.all(completedMembers.map(async uid => {
            if(!players[uid]) return;
            try {
              const lockedPick=await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+uid));
              if(lockedPick.exists())players[uid].picks[phase]=Array.isArray(lockedPick.data().picks)?lockedPick.data().picks:[];
            } catch(e) {
              // Older pools may have this player's locked picks only in the
              // legacy player document. Keep that fallback instead of failing
              // the entire Global leaderboard because one new-format document
              // is unavailable.
              console.warn('A locked prediction could not be loaded; using legacy prediction data when available.',e);
            }
          }));
        } else if (phase==='reunion') {
          // Reunion scores can be shown as soon as an individual player locks.
          // Other locked players' picks are readable only after the viewer has
          // locked too. Until then, fetch the viewer's own pick document only.
          let viewerPick=null;

            const viewerPickSnap=await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+currentUid));

              viewerPick=viewerPickSnap.data();
              if(players[currentUid])players[currentUid].picks[phase]=Array.isArray(viewerPick.picks)?viewerPick.picks:[];
            }
          }
          const viewerLocked=!!currentUid&&(phaseStatusData?.completedMembers?.includes(currentUid) ||
            Number.isFinite(Number(viewerPick?.lockedAt)));
          const pickUids=viewerLocked?Object.entries(players)
            .filter(([uid,p]) => phaseStatusData?.completedMembers?.includes(uid) ||
              (p.phase==='reunion' && ['watch','close','final'].includes(p.screen)))
            .map(([uid])=>uid).filter(uid=>uid!==currentUid):[];
          await Promise.all(pickUids.map(async uid => {
            try {
              const lockedPick = await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+uid));
              if (lockedPick.exists() && players[uid]) players[uid].picks[phase]=Array.isArray(lockedPick.data().picks)?lockedPick.data().picks:[];
            } catch (e) { console.warn('A Reunion prediction could not be loaded yet.', e); }
          }));
        } else if (currentUid && players[currentUid]) {
          const own = await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+currentUid));
          if (own.exists()) players[currentUid].picks[phase]=Array.isArray(own.data().picks)?own.data().picks:[];
        }
      } catch (e) {
        if(['permission-denied','firestore/permission-denied'].includes(e?.code))throw e;
        console.warn('New phase storage is not available for this pool yet.', e);
      }
    }));
    return {players, status};
  },

  const pushRow = () => { pushField(); if (row.some(c=>c!=='')) rows.push(row); row = []; };

    const ch = text[i];

      else { inQ = !inQ; fieldWasQuoted = true; }
    } else if (ch === ',' && !inQ) pushField();

      if (ch === '\r' && text[i+1] === '\n') i++;

function ErrorScrollManager() {
  const lastError=useRef({node:null,text:''});
  useEffect(()=>{
    const root=document.getElementById('root');
    if(!root)return;
    let frame=0;
    const revealLatestError=()=>{
      cancelAnimationFrame(frame);
      frame=requestAnimationFrame(()=>{
        const visibleErrors=[...root.querySelectorAll('[role="alert"]')].filter(node=>{
          const style=window.getComputedStyle(node);
          return style.display!=='none'&&style.visibility!=='hidden'&&node.getClientRects().length>0;
        });
        const error=visibleErrors.at(-1);
        if(!error)return;
        const text=error.textContent?.trim()||'';
        if(lastError.current.node===error&&lastError.current.text===text)return;
        lastError.current={node:error,text};
        if(!error.hasAttribute('tabindex'))error.setAttribute('tabindex','-1');
        error.scrollIntoView({behavior:'auto',block:'center',inline:'nearest'});
        error.focus({preventScroll:true});
      });
    };
    const observer=new MutationObserver(revealLatestError);
    observer.observe(root,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['role']});
    revealLatestError();
    return()=>{cancelAnimationFrame(frame);observer.disconnect();};
  },[]);
  return null;
}

function RatingPhoto({person,className}) {

      </div>;
    })}</div>
  </article>;
}
function ChemistryPanel({eng,seasonId,poolName,globalPool,currentUid,myRatingDoc,community,globalCommunity,memberLabels,onSave,saving,feedback,onRefresh}) {

  const fingerprintCategory=[...RATING_CATEGORIES].sort((a,b)=>categoryAverages[b.id]-categoryAverages[a.id])[0];
  const myRanked=eng.CAST.map(person=>({person,score:overallRating(draft[person.name])})).filter(row=>row.score!=null).sort((a,b)=>b.score-a.score||alphaByName(a.person.name,b.person.name));
  const visibleMyRanked=myRanked.filter(row=>gender==='all'||row.person.gender===gender);
  const showPersonalPodium=visibleCast.length>=3&&completeCount===visibleCast.length;

    const consensus=[...distributions].filter(row=>row.entries.length>=CHEMISTRY_HIGHLIGHT_THRESHOLDS.minConsensusRatings&&row.range<=CHEMISTRY_HIGHLIGHT_THRESHOLDS.consensus&&row.name!==wildSplit?.name&&row.name!==debate?.name).sort((a,b)=>a.range-b.range||alphaByName(a.name,b.name))[0];

      consensus&&{type:'consensus',kicker:'The rare agreement',title:'The room has spoken.',emoji:'🤝',distribution:consensus},

  },[community?.loadedAt,gender]);
  useEffect(()=>setHighlightIndex(0),[community?.loadedAt,gender]);

  const highlightPlayerLabel=entry=>entry?.uid===currentUid?'You':memberLabels[entry?.uid]||entry?.username||'A player';
  const activeHighlightPlayer=activeHighlight?.entry?highlightPlayerLabel(activeHighlight.entry):'';

  }).filter(row=>(gender==='all'||row.person.gender===gender)&&row.delta!=null)

  const scoreLabel=value=>value==null?'—':(sort==='overall'?value.toFixed(1)+'/40':value.toFixed(1)+'/10');

  const cast=[
    {name:'AD',gender:'F',photoUrl:'images/cast/love-is-blind-us-6/AD.webp'},
    {name:'Amy',gender:'F',photoUrl:'images/cast/love-is-blind-us-6/Amy.webp'},
    {name:'Chelsea',gender:'F',photoUrl:'images/cast/love-is-blind-us-6/Chelsea.webp'},
    {name:'Clay',gender:'M',photoUrl:'images/cast/love-is-blind-us-6/Clay.webp'},
    {name:'Jimmy',gender:'M',photoUrl:'images/cast/love-is-blind-us-6/Jimmy.webp'},
    {name:'Johnny',gender:'M',photoUrl:'images/cast/love-is-blind-us-6/Johnny.webp'},
  ];
  const demoPlayers=[
    {uid:'demo-me',username:'You'},
    {uid:'demo-maya',username:'Maya'},
    {uid:'demo-lex',username:'Lex'},
    {uid:'demo-priya',username:'Priya'},
    {uid:'demo-ben',username:'Ben'},
    {uid:'demo-sofia',username:'Sofia'},
    {uid:'demo-marcus',username:'Marcus'},
    {uid:'demo-jules',username:'Jules'},
  ];
  const scorecards=demoPlayers.map((player,playerIndex)=>({
    ...player,
    shared:true,
    ratings:cast.map((person,index)=>({
      name:person.name,
      gender:person.gender,
      flag:index===0&&playerIndex<6?'red':index===1&&playerIndex<5?'green':'',
      values:{
        hotness:(6+index+playerIndex)%11,
        humour:(8+index*2+playerIndex)%11,
        intelligence:(9+index+playerIndex*2)%11,
        vibes:(5+index*3+playerIndex)%11,
      },
    })),
  }));
  const aggregate={
    participantCount:scorecards.length,
    updatedAt:1,
    cast:cast.map(person=>{
      const ratings=scorecards.map(card=>card.ratings.find(rating=>rating.name===person.name));
      const totals={},counts={};
      RATING_CATEGORIES.forEach(category=>{
        totals[category.id]=ratings.reduce((sum,rating)=>sum+rating.values[category.id],0);counts[category.id]=ratings.length;
      });
      totals.overall=ratings.reduce((sum,rating)=>sum+overallRating(rating.values),0);counts.overall=ratings.length;
      totals.redFlag=ratings.reduce((sum,rating)=>sum+(rating.flag==='red'?1:0),0);counts.redFlag=totals.redFlag;
      totals.greenFlag=ratings.reduce((sum,rating)=>sum+(rating.flag==='green'?1:0),0);counts.greenFlag=totals.greenFlag;
      return {name:person.name,gender:person.gender,totals,counts};
    }),
  };
  const [mine,setMine]=useState({ratings:scorecards[0].ratings,updatedAt:1});
  const [community,setCommunity]=useState(globalPool?{kind:'global',aggregate,loadedAt:1}:{kind:'friends',entries:scorecards,loadedAt:1});
  const [feedback,setFeedback]=useState('');
  const savePreview=(ratings,shareWithFriends)=>{
    const updatedAt=Date.now();
    setMine({ratings,updatedAt});
    if(!globalPool)setCommunity(current=>({...current,entries:[
      ...current.entries.filter(entry=>entry.uid!=='demo-me'),
      ...(shareWithFriends?[{uid:'demo-me',username:'You',shared:true,ratings}]:[]),
    ],loadedAt:updatedAt}));
    setFeedback(globalPool?'Saved privately and added to the global averages.':'Ratings saved.');
  };
  return <div className="app">
    <BrandHeader season={globalPool?'Love Is Blind UK: Season 3':'Love Is Blind US: Season 6'}><h1>{globalPool?'Global Pool':'Pod Squad'}</h1></BrandHeader>
    <PoolTabs tabs={[{id:'play',label:'Play'},{id:'standings',label:'Standings'},{id:'chemistry',label:'Heat Check'},{id:'rules',label:'Rules'}]} active="chemistry" onChange={()=>{}}/>
    <ChemistryPanel eng={{CAST:cast}} seasonId="chemistry-preview" poolName="Pod Squad" globalPool={globalPool} currentUid="demo-me" myRatingDoc={mine} community={community} globalCommunity={{kind:'global',aggregate,loadedAt:1}} memberLabels={{'demo-me':'You','demo-maya':'Maya','demo-lex':'Lex'}} onSave={savePreview} saving={false} feedback={feedback} onRefresh={()=>setFeedback('Preview refreshed.')}/>
  </div>;
}
function Sel({label,value,onChange,options,placeholder}) {

function StakeSlider({value,onChange,max,multiplier=1,pointsPerHeart=1,previewNote='before clock and grain bonuses'}) {
  const id=useId();

  return <div className="field" style={{minWidth:170}}><label className="small" htmlFor={id}>Stake (max {Math.max(0,max)})</label><div className="stakebox"><input id={id} type="range" min={hasBudget?5:0} max={Math.max(0,max)} step={5} value={safeValue} disabled={!hasBudget} onChange={ev=>onChange(+ev.target.value)}/><span className="stakeval">{safeValue}♥</span></div><div className="points-preview" aria-live="polite" aria-atomic="true"><strong>{safeValue}♥ → {preview} pts</strong><span>{hasBudget?previewNote:'No Hearts remaining'}</span></div></div>;
}

function PodsBoard({w,picks,add,remove,spent,eng,finalWindow,onPendingChange,pendingRef}) {
  const {MEN,WOMEN,COUPLES,RULES,nameOf,membOf,coupleFor,pairKeyFor,personKey,leadM,fmt}=eng;
  const [him,setHim]=useState(''),[her,setHer]=useState(''),[stake,setStake]=useState(30);
  const [adding,setAdding]=useState(picks.length===0);
  const engaged=new Set(COUPLES.filter(c=>c.podsEligible&&Number.isFinite(c.engagedEp)&&c.engagedEp<=w).flatMap(c=>[c.him,c.her]).map(personKey));
  const used=new Set(picks.flatMap(p=>membOf(p.c)).map(personKey));
  const predictedPairs=new Set(picks.map(p=>pairKeyFor(p.c)));
  const pairAvailable=(man,woman)=>{
    if(!man||!woman)return true;
    const pairKey=pairKeyFor(man+'|'+woman);
    return !predictedPairs.has(pairKey);
  };
  const menA=MEN.filter(n=>!engaged.has(personKey(n))&&!used.has(personKey(n))&&pairAvailable(n,her));
  const womA=WOMEN.filter(n=>!engaged.has(personKey(n))&&!used.has(personKey(n))&&pairAvailable(him,n));
  const left=RULES.phases.pods.budget-spent, maxS=Math.min(RULES.phases.pods.cap,left);
  const doAdd=()=>{add({c:him+'|'+her,s:Math.min(stake,maxS),w});setHim('');setHer('');setAdding(false);};
  const startAnother=()=>{setHim('');setHer('');setAdding(true);};
  const predictionInProgress=adding&&(him||her);
  const skipPrediction=useCallback(()=>{setHim('');setHer('');setAdding(false);},[]);
  pendingRef.current=skipPrediction;
  useEffect(()=>{onPendingChange(!!predictionInProgress);return()=>onPendingChange(false);},[predictionInProgress,onPendingChange]);
  const predictionStatus=p=>{
    const couple=coupleFor(p.c);
    return couple&&Number.isFinite(couple.engagedEp)&&couple.engagedEp<=w
      ? 'Resolved in Episode '+couple.engagedEp
      : 'Locked after Episode '+p.w+' · Against-the-Clock x'+fmt(leadM(w-p.w))+' if they propose next episode';
  };
  const firstPick=picks.length===0;
  return <div className="card phase-board phase-board-pods"><h2 className="board-window-title">Your Pods predictions</h2><p className="lede"><b>Prediction window: after Episode {w}, before Episode {w+1}.</b> {finalWindow?<React.Fragment><b>This is your last chance to use your Pods Hearts.</b> Any left after this window are lost.</React.Fragment>:'You can spend some, all, or none of your remaining Hearts now. Any Hearts you keep will remain available in later Pods prediction windows.'}</p><Budget phase="pods" spent={spent} RULES={RULES} finalWindow={finalWindow}/>
    {firstPick&&<div className="guided-pick"><div className="guided-pick-kicker">Your first prediction</div><p>Choose one pair, decide how many Hearts you believe in them, then confirm. That’s all you need to start; the Rules tab is here whenever you want the full details.</p></div>}
    {adding&&<React.Fragment><div className="row"><Sel label="Him" value={him} onChange={setHim} options={menA}/><Sel label="Her" value={her} onChange={setHer} options={womA}/></div><div className="row"><StakeSlider value={stake} onChange={setStake} max={maxS} pointsPerHeart={RULES.POINTS_PER_HEART} previewNote="minimum before bonuses"/><button className="btn-add btn-confirm" disabled={!him||!her||!pairAvailable(him,her)||left<5} onClick={doAdd}>Confirm prediction</button></div></React.Fragment>}
    {picks.length>0&&<React.Fragment><hr className="divider"/>{picks.map((p,i)=><div className="pickchip" key={i}><div><div className="nm">{nameOf(p.c)} - {p.s}♥</div><div className="subtle">{predictionStatus(p)}</div></div>{p.w===w&&<button className="btn-x" onClick={()=>remove(i)} aria-label={'Remove prediction for '+nameOf(p.c)}>✕</button>}</div>)}{!adding&&left>=5&&<button className="btn-primary" style={{marginTop:14}} onClick={startAnother}>+ Make Another Prediction</button>}</React.Fragment>}
  </div>;
}
function DatingBoard({w,picks,add,remove,spent,eng,finalWindow}) {
  const {COUPLES,RULES,DATING_RESULTS,PH_SPAN,PH_STARTW,DATING_MULT,nameOf,fmt,leadM,personKey,flirtResultFor}=eng;
  const open=w>=PH_STARTW.dating&&w<PH_SPAN.dating.retreatEndEp;
  const left=RULES.phases.dating.budget-spent, maxS=Math.min(RULES.phases.dating.cap,left);
  const [bC,setBC]=useState(''),[bS,setBS]=useState(20);
  const [sC,setSC]=useState(''),[sS,setSS]=useState(20);
  const [fP,setFP]=useState(''),[fS,setFS]=useState(20);

  const bO=retreatCouples.filter(c=>!(DATING_RESULTS.breakup[c.id]&&DATING_RESULTS.breakup[c.id].ep<=w)&&!picks.some(p=>p.m==='breakup'&&p.c===c.id));
  const sO=retreatCouples.filter(c=>!(DATING_RESULTS.sex[c.id]&&DATING_RESULTS.sex[c.id].ep<=w)&&!picks.some(p=>p.m==='sex'&&p.c===c.id));
  const fO=retreatCouples.flatMap(c=>[c.him,c.her]).filter((person,index,people)=>people.indexOf(person)===index&&!(flirtResultFor(person)&&flirtResultFor(person).ep<=w)&&!picks.some(p=>p.m==='flirt'&&personKey(p.p)===personKey(person)));
  const opt=l=>l.map(c=>({v:c.id,t:nameOf(c.id)}));
  const ml=p=>p.m==='breakup'?'Breaks up during the retreat':(p.m==='sex'?'Sleep together':FLIRT_SHORT);
  const resultFor=p=>p.m==='flirt'?flirtResultFor(p.p):DATING_RESULTS[p.m]?.[p.c];
  const predictionStatus=p=>{
    const result=resultFor(p);
    if(result?.ep<=w) return 'Resolved in Episode '+result.ep+' · Against-the-Clock x'+fmt(leadM(Math.max(0,result.ep-p.w-1)));
    return p.w===w?'editable until you start Episode '+(w+1):'Locked after Episode '+p.w+' · predicting before you see it coming';
  };
  return <div className="card phase-board phase-board-dating"><h2 className="board-window-title">{open?'Your Retreats predictions':'Retreats predictions locked'}</h2><p className="lede">{open?<React.Fragment><b>Prediction window: after Episode {w}, before Episode {w+1}.</b> {finalWindow?<React.Fragment><b>This is your last chance to use your Retreats Hearts.</b> Any left after this window are lost.</React.Fragment>:'Spend some, all, or none now. Hearts you keep remain available in later Retreats windows, and earlier picks earn more for predicting before you see the outcome coming.'}</React.Fragment>:'The retreat scoring window has ended.'}</p><Budget phase="dating" spent={spent} RULES={RULES} finalWindow={finalWindow}/>
    {open&&<React.Fragment>

function ScoreProgressChart({phases, ranked, phaseTotals, RULES, playerName, hasRetro=false, valuesAreCumulative=false,animated=false}) {
  if (!phases.length || !ranked.length) return null;
  const width=560, height=210, margin={top:18,right:12,bottom:40,left:42};
  const plotWidth=width-margin.left-margin.right, plotHeight=height-margin.top-margin.bottom;
  const scoreText=n=>String(+Number(n).toFixed(2));
  const colourOrder=ranked.slice().sort();
  const colourFor=id=>{
    const index=colourOrder.indexOf(id);
    return `hsl(${Math.round((332+index*137.508)%360)} 66% 53%)`;
  };
  const series=ranked.map(id=>{
    let running=0;
    const values=phases.map(ph=>{
      if(valuesAreCumulative)return phaseTotals[ph][id]||0;
      running+=phaseTotals[ph][id]||0;
      return running;
    });
    return {id,name:playerName(id),values,color:colourFor(id)};
  });
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const x=index=>phases.length===1 ? margin.left+plotWidth/2 : margin.left+index*(plotWidth/(phases.length-1));
  const y=value=>margin.top+plotHeight-(value/max)*plotHeight;
  const linePath=values=>values.map((value,index)=>(index?'L':'M')+x(index).toFixed(1)+' '+y(value).toFixed(1)).join(' ');
  const ticks=[0,0.5,1];
  return <section className={'score-trend'+(animated?' animated':'')} aria-labelledby="score-trend-title">
    <h3 id="score-trend-title">Score by phase</h3>
    <p className="score-trend-note">Cumulative points after each completed phase.{hasRetro?' Totals include retroactive changes not shown in this chart.':''}</p>
    <svg className="score-chart" viewBox={'0 0 '+width+' '+height} role="img" aria-label="Cumulative score by phase for each player">
      <title>Score progression by phase</title>
      <desc>{series.map(s=>s.name+' ends with '+scoreText(s.values[s.values.length-1])+' points').join('. ')}</desc>
      {ticks.map(t=>{const value=max*t,py=y(value);return <g key={t}><line className="score-chart-grid" x1={margin.left} x2={width-margin.right} y1={py} y2={py}/><text className="score-chart-axis" x={margin.left-8} y={py+3} textAnchor="end">{scoreText(value)}</text></g>;})}
      <text className="score-chart-axis" x="12" y={margin.top+plotHeight/2} transform={'rotate(-90 12 '+(margin.top+plotHeight/2)+')'} textAnchor="middle">Points</text>
      {phases.map((phase,index)=><text className="score-chart-phase" key={phase} x={x(index)} y={height-12} textAnchor="middle">{RULES.phases[phase].label}</text>)}
      {series.map((s,seriesIndex)=><g key={s.id}><path className="score-series" d={linePath(s.values)} style={{stroke:s.color,animationDelay:(seriesIndex*.18)+'s'}}/>{s.values.map((value,index)=><circle className="score-point" style={{animationDelay:(seriesIndex*.18+index*.32+.35)+'s'}} key={index} cx={x(index)} cy={y(value)} r="4" fill={s.color}><title>{s.name+', '+RULES.phases[phases[index]].label+': '+scoreText(value)+' points'}</title></circle>)}</g>)}
    </svg>
    <div className="score-legend" aria-label="Player score legend">{series.map(s=><span className="score-legend-item" key={s.id}><span className="score-legend-swatch" style={{backgroundColor:s.color}}></span><span>{s.name} <span className="score-legend-total">{scoreText(s.values[s.values.length-1])}</span></span></span>)}</div>
  </section>;
}

const MODAL_FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function useModalLifecycle(onClose,canClose=true) {
  const modalRef=useRef(null), closeRef=useRef(onClose), canCloseRef=useRef(canClose);
  closeRef.current=onClose;canCloseRef.current=canClose;
  useEffect(()=>{
    const trigger=document.activeElement, previousOverflow=document.body.style.overflow;
    document.body.style.overflow='hidden';
    const focusTimer=setTimeout(()=>modalRef.current?.focus(),0);
    const onKeyDown=e=>{
      if(e.key==='Escape'&&canCloseRef.current){e.preventDefault();closeRef.current();return;}
      if(e.key!=='Tab'||!modalRef.current)return;
      const modal=modalRef.current;
      const focusable=[...modal.querySelectorAll(MODAL_FOCUSABLE)].filter(element=>element.getClientRects().length>0);
      if(!focusable.length){e.preventDefault();modal.focus();return;}
      const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;
      if(e.shiftKey&&(active===first||active===modal||!modal.contains(active))){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&(active===last||!modal.contains(active))){e.preventDefault();first.focus();}
    };
    document.addEventListener('keydown',onKeyDown);
    return()=>{
      clearTimeout(focusTimer);document.removeEventListener('keydown',onKeyDown);
      document.body.style.overflow=previousOverflow;
      if(trigger?.isConnected&&typeof trigger.focus==='function')setTimeout(()=>trigger.focus(),0);
    };
  },[]);
  return modalRef;
}

function ConfirmModal({title,body,confirmLabel='Confirm',cancelLabel='Cancel',onConfirm,onCancel}) {
  const titleId=useId(), modalRef=useModalLifecycle(onCancel);
  const readVisibleViewport=()=>{
    const viewport=window.visualViewport;
    return {
      left:Math.max(0,viewport?.offsetLeft||0),
      width:Math.max(0,viewport?.width||document.documentElement.clientWidth||window.innerWidth),
    };
  };
  const [visibleViewport,setVisibleViewport]=useState(readVisibleViewport);
  useEffect(()=>{
    const viewport=window.visualViewport;
    const syncViewport=()=>{
      const next=readVisibleViewport();
      setVisibleViewport(current=>current.left===next.left&&current.width===next.width?current:next);
    };
    viewport?.addEventListener('resize',syncViewport);
    viewport?.addEventListener('scroll',syncViewport);
    window.addEventListener('resize',syncViewport);
    syncViewport();
    return()=>{
      viewport?.removeEventListener('resize',syncViewport);
      viewport?.removeEventListener('scroll',syncViewport);
      window.removeEventListener('resize',syncViewport);
    };
  },[]);
  const structuredBody=React.isValidElement(body);
  const paragraphs=structuredBody?[]:String(body||'').split(/\n\s*\n/).filter(Boolean);
  return <div className="modal-backdrop" style={{left:visibleViewport.left,right:'auto',width:visibleViewport.width}} role="presentation" onMouseDown={e=>{if(e.target===e.currentTarget)onCancel();}}>
    <div className="modal" ref={modalRef} tabIndex="-1" role="dialog" aria-modal="true" aria-labelledby={titleId}>
      <h2 id={titleId}>{title}</h2>
      {structuredBody?body:paragraphs.map((paragraph,index)=><p key={index}>{paragraph}</p>)}
      <div className="modal-actions">
        <button className="btn-secondary" onClick={onCancel}>{cancelLabel}</button>
        <button className="btn-primary" onClick={onConfirm}>{confirmLabel}</button>
      </div>
    </div>
  </div>;
}

          </button>
          <p className="subtle" style={{marginTop:7}}>{activePool.membershipClosed===true?'Reopening makes existing pending invitations usable again.':'Closing membership is optional. It is required only if you want the completed leaderboard to become final.'}</p>
        </div>}
        {poolInviteFeedback&&<p role={poolInviteError?'alert':'status'} style={{color:poolInviteError?'#b71f49':'var(--muted)',fontWeight:600}}>{poolInviteFeedback}</p>}
      </div>}
    </div>}
    {poolTab==='chemistry'&&(chemistryLoading||!chemistryMine||!chemistryCommunity||!chemistryGlobalCommunity)
      ? <div className="card" id="pool-panel-chemistry" role="tabpanel" aria-labelledby="pool-tab-chemistry"><h2>Mixing the chemistry…</h2><p className="lede">Loading your private scorecard and the pool’s latest hot takes.</p></div>
      : poolTab==='chemistry'&&<ChemistryPanel eng={eng} seasonId={seasonForPool(activePool).id} poolName={activePool.name} globalPool={activePool.global===true} currentUid={user.uid} myRatingDoc={chemistryMine} community={chemistryCommunity} globalCommunity={chemistryGlobalCommunity} memberLabels={memberLabels} onSave={saveChemistry} saving={chemistrySaving} feedback={chemistryFeedback} onRefresh={refreshChemistry}/>}
    {poolTab==='rules' && cfg.PLAYABLE && <PhaseGuidePanel kind="rules" phaseLabel={RULES.phases[phase].label} tagline={phaseIntro.tagline} id="pool-panel-rules" labelledBy="pool-tab-rules">{phaseIntro.rules}</PhaseGuidePanel>}
    {poolTab==='scoring' && cfg.PLAYABLE && <PhaseGuidePanel kind="scoring" phaseLabel={RULES.phases[phase].label} id="pool-panel-scoring" labelledBy="pool-tab-scoring">{phaseIntro.scoring}</PhaseGuidePanel>}
    {poolTab==='play' && !cfg.PLAYABLE && <div className="card" id="pool-panel-play" role="tabpanel" aria-labelledby="pool-tab-play">
      <h2>Your pool is ready</h2>
      <p className="lede">{seasonPoolStatusLabel(seasonForPool(activePool))||'This season has not started yet.'}</p>
      <div className="notice"><b>Season has not started.</b> {activePool.global===true?'The Global Pool is open to everyone. Share the app with friends and they can join from their own account.':'Use the Standings tab to invite your friends now.'} Predictions will open shortly after the first episodes drop.</div>
      {activePool.global===true&&<React.Fragment><button className="btn-secondary" disabled={sharingPool} onClick={shareGlobalPool}>{sharingPool?'Getting the link…':'Share Global Pool'}</button>{globalShareFeedback&&<p className="subtle" role={/could not|try copying/i.test(globalShareFeedback)?'alert':'status'} style={{marginTop:8}}>{globalShareFeedback}</p>}</React.Fragment>}
      <button className="btn-secondary" disabled={refreshingPool} onClick={()=>refreshPool(true)}>{refreshingPool?'Checking for updates…':'Check for season updates'}</button>
    </div>}
    {poolTab==='play' && cfg.PLAYABLE && <div id="pool-panel-play" role="tabpanel" aria-labelledby="pool-tab-play">
      <Stepper phase={phase} RULES={RULES}/>
      {cfg.BOUNDARIES_LIVE&&<p className="subtle" style={{textAlign:'center',margin:'-2px 0 14px'}}>For live seasons, phase boundaries may be adjusted as episodes are confirmed.</p>}
      {screen==='intro'&&<div className="card"><h2>{navigationPhaseLabel(phase,RULES)}</h2><p className="lede">{phaseIntro.tagline}</p><button className="btn-primary" disabled={gating} onClick={()=>phase==='pods'&&w<PH_STARTW.pods?startPods():setScreen('board')}>{phase==='pods'&&w<PH_STARTW.pods?"I've watched Episode "+PH_STARTW.pods+' - Start predicting':phase==='pods'?'Return to prediction board':'Open the prediction board'}</button></div>}
      {screen==='board'&&<React.Fragment>
        <PhaseHero phase={phase} w={w} RULES={RULES}/>
        {historicalPredictionDeadline!=null&&<div className="notice" style={{margin:'8px 0 14px'}}><b>Your last chance for {RULES.phases[phase].label} predictions is after Episode {historicalPredictionDeadline}.</b></div>}
        {crossover&&<div className="notice" style={{margin:'8px 0 14px'}}><b>{crossoverMessage}</b> This lock covers both boards before you watch Episode {w+1}.</div>}
        <RevealSummary reveal={reveal} heading={revealHeading} eng={eng} meId={user.uid} memberLabels={memberLabels}/>
        <PersistentRetroReveals events={persistentRetroEvents} globalPool={activePool.global===true} picks={picks} eng={eng}/>
        {predictionPhases.includes('pods')&&<PodsBoard w={w} picks={picks.pods} add={p=>addPick('pods',p)} remove={i=>removePick('pods',i)} spent={eng.spentBy(picks.pods)} eng={eng} finalWindow={finalPredictionWindowFor('pods')} onPendingChange={setPendingPodsPrediction} pendingRef={pendingPodsSkip}/>}
        {predictionPhases.includes('dating')&&<DatingBoard w={w} picks={picks.dating} add={p=>addPick('dating',p)} remove={i=>removePick('dating',i)} spent={eng.spentBy(picks.dating)} eng={eng} finalWindow={finalPredictionWindowFor('dating')}/>}
        {predictionPhases.includes('weddings')&&<WeddingsBoard w={w} picks={picks.weddings} add={p=>addPick('weddings',p)} remove={i=>removePick('weddings',i)} spent={eng.spentBy(picks.weddings)} eng={eng} finalWindow={finalPredictionWindowFor('weddings')}/>}
        {predictionPhases.includes('reunion')&&<ReunionBoard w={w} picks={picks.reunion} add={p=>addPick('reunion',p)} remove={i=>removePick('reunion',i)} spent={eng.spentBy(picks.reunion)} eng={eng}/>}
        <ContestantReferenceBoard eng={eng} w={w} phase={phase}/>
        <p className="lock-rally">Ready to lock your predictions?<span>You’ll recap every pick on the next screen before anything locks.</span></p>
        <button className="btn-primary" disabled={gating} onClick={lockPredictions}>{lockLabel} →</button>
        {predictionPhases.includes('pods')&&pendingPodsPrediction&&<div className="notice" role="status" style={{margin:'14px 0 0'}}><b>This prediction hasn't been added yet - confirm it to lock it in.</b> <button className="btn-secondary" style={{display:'inline-block',width:'auto',padding:'6px 10px',margin:'8px 0 0'}} onClick={()=>pendingPodsSkip.current()}>Skip this prediction</button></div>}
        <p className="subtle" style={{textAlign:'center'}}>Your predictions are saved and locked before you watch.</p>
      </React.Fragment>}
      {screen==='watch'&&<div className="card gatecard">
        <h2>Your {lockedPhaseLabel} predictions are locked</h2>
        {watchThrough>w?<React.Fragment>
          <p className="lede">You can now watch {watchRangeLabel(phase,w+1,watchThrough)}. Return here when you finish.</p>
          {lockedPickCards}
          <PersistentRetroReveals events={persistentRetroEvents} globalPool={activePool.global===true} picks={picks} eng={eng}/>
          <button className="btn-primary" disabled={gating} onClick={()=>finishWatch()}>I've finished {watchRangeLabel(phase,w+1,watchThrough)} →</button>
        </React.Fragment>:readyWatchEnd>w?<React.Fragment>
          <p className="lede">You can now watch {watchRangeLabel(phase,w+1,readyWatchEnd)}. Return here when you finish.</p>
          {lockedPickCards}
          <PersistentRetroReveals events={persistentRetroEvents} globalPool={activePool.global===true} picks={picks} eng={eng}/>
          <button className="btn-primary" disabled={gating} onClick={()=>finishWatch(readyWatchEnd)}>I've finished {watchRangeLabel(phase,w+1,readyWatchEnd)} →</button>
        </React.Fragment>:<React.Fragment>
          {w>=PH_SPAN[phase].endEp&&BOUNDARIES_FINAL[phase]!==false
            ? <React.Fragment><p className="lede">The {navigationPhaseLabel(phase,RULES)} boundary is confirmed at Episode {PH_SPAN[phase].endEp}.</p>{lockedPickCards}<PersistentRetroReveals events={persistentRetroEvents} globalPool={activePool.global===true} picks={picks} eng={eng}/><button className="btn-primary" disabled={gating} onClick={finalizeCaughtUpPhase}>Complete {navigationPhaseLabel(phase,RULES)} →</button></React.Fragment>
            : BOUNDARIES_FINAL[phase]===false&&w>=PH_SPAN[phase].endEp
              ? <React.Fragment><p className="lede">You are caught up through Episode {w}. Your predictions are saved while the {navigationPhaseLabel(phase,RULES)} boundary is finalized.</p>{lockedPickCards}<PersistentRetroReveals events={persistentRetroEvents} globalPool={activePool.global===true} picks={picks} eng={eng}/><div className="notice"><b>This phase is still provisional.</b> The season manager will confirm the boundary as episodes are released. Refresh this page after that update.</div><button className="btn-secondary" disabled={refreshingPool} onClick={()=>refreshPool(true)}>{refreshingPool?'Refreshing…':'Refresh season data'}</button></React.Fragment>
              : <React.Fragment><p className="lede">You are caught up through Episode {w}. Your predictions remain locked. Come back when the next episodes are out.</p>{lockedPickCards}<PersistentRetroReveals events={persistentRetroEvents} globalPool={activePool.global===true} picks={picks} eng={eng}/><button className="btn-secondary" disabled={refreshingPool} onClick={()=>refreshPool(true)}>{refreshingPool?'Refreshing…':'Refresh season data'}</button></React.Fragment>}
        </React.Fragment>}
      </div>}
      {screen==='close'&&closeInfo&&<React.Fragment>
        <RevealSummary reveal={reveal} heading={revealHeading} eng={eng} meId={user.uid} memberLabels={memberLabels} extraEntries={closeInfo.closing} shareData={phaseShareData}/>
        <div className="card">
          <h2>{navigationPhaseLabel(phase,RULES)} complete</h2>
          {closeInfo.closing.length>0&&<p className="lede">{phase==='dating'&&!RESULTS_READY.dating?'Retreats results are still being confirmed.':'Your checkpoint is locked.'}</p>}
          <div className="notice">{RESULTS_READY[phase]||phase==='dating'
            ? 'Your predictions are permanently locked. Your live checkpoint score is now in Standings and may shift as more pool members finish this phase.'
            : 'Your predictions are permanently locked. This checkpoint will appear in the live standings when its results are confirmed.'}</div>
          {phaseCompletionError&&<ErrorCard title="Completion not registered" message={phaseCompletionError}><button className="btn-secondary" disabled={retryingPhaseCompletion} onClick={()=>registerPhaseCompletion(activePool.id,phase,user.uid)}>{retryingPhaseCompletion?'Retrying…':'Retry phase completion'}</button></ErrorCard>}
          <button className="btn-primary" disabled={!!phaseCompletionError||retryingPhaseCompletion} onClick={openNextPhase}>{NEXT_PH[phase]?'Continue to '+navigationPhaseLabel(NEXT_PH[phase],RULES)+' →':'Finish the season →'}</button>
        </div>
      </React.Fragment>}
      {screen==='final'&&<div className="card gatecard">
        <div className="crown">👑</div>
        <div className="winner">Season complete!</div>
        <p className="lede" style={{marginBottom:12}}>Your full score is live. Standings and Against-the-Grain bonuses continue updating as more pool members finish. When the final standings lock, your full-screen Wrapped story will appear there.</p>
        <button className="btn-primary" onClick={()=>switchPoolTab('standings')}>View standings &amp; Wrapped</button>
      </div>}
      {['intro','watch','close'].includes(screen)&&<ContestantReferenceBoard eng={eng} w={w} phase={phase}/>}
    </div>}
    {showHowItWorks&&<HowItWorksModal onClose={closeHowItWorks} rules={eng.RULES} poolSize={activePool.members.length}/>}
    {showSettings&&<SettingsModal theme={theme} onThemeChange={changeTheme} onClose={()=>setShowSettings(false)} pools={pools} activePool={activePool} userId={user.uid} userEmail={user.email||''} profileUsername={profile.username} notificationPreferences={notificationPreferences} onNotificationChange={saveNotificationPreference} notificationSaving={notificationSaving} onDeletePool={doDeletePool} onLeavePool={doLeavePool} onDeleteAccount={doDeleteAccount} onSetPoolMembershipClosed={doSetPoolMembershipClosed} onRenamePool={doRenamePool} onChangeUsername={changeUsername} onSignOut={handleSignOut} signingOut={signingOut} membershipUpdating={updatingPoolMembership||destructiveActionPending} error={err} onDismissError={()=>setErr('')}/>}
    {confirmDialog&&<ConfirmModal {...confirmDialog} onConfirm={()=>settleConfirmation(true)} onCancel={()=>settleConfirmation(false)}/>}
  </div>;
}
let appMounted=false;
const mountApp = () => {
  if(appMounted||window.__ttwBootFailed)return;
  try {
    const root=ReactDOM.createRoot(document.getElementById('root'));
    appMounted=true;window.__ttwAppMounted=true;window.clearTimeout(window.__ttwFirebaseFallbackTimer);
    root.render(<AppErrorBoundary><ErrorScrollManager/>{CAST_CHEMISTRY_DEMO_MODE?<ChemistryPreview/>:<App/>}</AppErrorBoundary>);
  } catch(error) {
    console.error('Through the Wall could not start.',error);
    reportTtwError('startup_failed',error,{operation:'mount_app'});
    window.__ttwBootFailure='The app interface could not start. Reload the page to try again.';
    window.__ttwShowBootFailure(window.__ttwBootFailure);
  }
};
if (window._fb) mountApp();
else window.addEventListener('firebase-ready',mountApp,{once:true});
</script>
</body>
</html>
