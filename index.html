<style>
:root{
  --ink:#351323; --wine:#431127; --wine-deep:#290817; --rose:#ed0c72;
  --purple:#7b2ee5;
  --gold:#7b2ee5; --gold-soft:#c8a9ff; --blush:#ffd0e3; --blush-soft:#fce7ef;
  --cream:#f8f3ef; --card:#fffaf7; --line:#efd7df; --miss:#9b5b6b;
  --muted:#806b70; --soft-text:#9a8589; --surface:#fff; --surface-soft:#fff5f7;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#f8e9ee; --wine:#f3dbe4; --wine-deep:#fff4f7; --rose:#e78cab;
  --purple:#b98cff;
  --gold:#f2c85f; --gold-soft:#f7df96; --blush:#71334c; --blush-soft:#3a1b29;
  --cream:#170a11; --card:#25131c; --line:#5b2d41; --miss:#c898a7;
  --muted:#c6a8b3; --soft-text:#a98794; --surface:#211019; --surface-soft:#301722;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold-soft);outline-offset:2px}
body{
  background:
    radial-gradient(1100px 560px at 85% -8%, #fce2eb 0%, transparent 60%),
    radial-gradient(900px 520px at -10% 8%, #f7e9e2 0%, transparent 55%),
    radial-gradient(760px 620px at -12% 48%, rgba(255,184,213,.3) 0%, transparent 68%),
    radial-gradient(760px 620px at 112% 54%, rgba(188,148,255,.22) 0%, transparent 68%),
    var(--cream);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:760px;margin:0 auto;padding:18px 18px 96px}
.hdr{text-align:center;padding:10px 0 0;position:relative}
.brand-logo{display:block;width:min(100%,500px);height:auto;margin:0 auto -2px}
.eyebrow{letter-spacing:.35em;font-size:11px;font-weight:600;color:var(--rose);text-transform:uppercase}
.hdr h1{font-family:'Playfair Display',Georgia,serif;font-size:34px;line-height:1.1;margin:8px 0 6px;color:var(--wine)}
.pool-sync-note{display:flex;align-items:center;justify-content:center;gap:6px;margin:-1px 0 5px;color:var(--muted);font-size:11px;font-weight:700;line-height:1.35}
.pool-sync-note span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;background:var(--blush-soft);color:var(--rose);font-size:11px}
.seasonpill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--wine);background:linear-gradient(135deg,var(--blush-soft),#f5d7e4);padding:4px 14px;border-radius:999px}
.stepper{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;margin:24px 0 18px;padding:0 4px}
.stepper::before{content:"";position:absolute;z-index:0;left:12.5%;right:12.5%;top:23px;height:1.5px;background:linear-gradient(90deg,#ec9fc0 0%,#cba4ea 46%,#d7b969 72%,#b996a4 100%)}
.step{--step-accent:#bfa7af;position:relative;z-index:1;display:grid;grid-template-rows:48px auto;place-items:center;min-width:0;padding:0 5px;color:#bba2aa}
.step:nth-child(1){--step-accent:var(--rose)}
.step:nth-child(2){--step-accent:var(--purple)}
.step:nth-child(3){--step-accent:#bd8a1c}
.step:nth-child(4){--step-accent:var(--wine)}
.step-icon{position:relative;width:46px;height:46px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--step-accent) 38%,var(--line));border-radius:50%;background:var(--card);color:var(--step-accent);font:700 22px/1 'Playfair Display',Georgia,serif;box-shadow:0 4px 14px rgba(67,17,39,.06)}
.step-icon svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.step.done .step-icon{background:color-mix(in srgb,var(--step-accent) 10%,var(--card))}
.step.done .step-icon::after{content:"✓";position:absolute;right:-2px;bottom:-1px;width:17px;height:17px;display:grid;place-items:center;border:2px solid var(--cream);border-radius:50%;background:var(--step-accent);color:#fff;font:800 9px/1 Inter,sans-serif}
.step.cur .step-icon{border-color:var(--step-accent);background:var(--step-accent);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--step-accent) 12%,transparent),0 7px 18px color-mix(in srgb,var(--step-accent) 22%,transparent)}
.step-label{margin-top:8px;font-size:9.5px;font-weight:800;letter-spacing:.08em;line-height:1.25;text-align:center;text-transform:uppercase}
.step.done .step-label,.step.cur .step-label{color:var(--wine)}
.phase-hero{--phase-accent:var(--rose);position:relative;overflow:hidden;margin:4px 0 18px;padding:28px 24px 23px;border:1px solid color-mix(in srgb,var(--phase-accent) 18%,var(--line));border-radius:18px;background:radial-gradient(circle at 92% 4%,color-mix(in srgb,var(--phase-accent) 10%,transparent),transparent 32%),linear-gradient(135deg,color-mix(in srgb,var(--blush-soft) 62%,var(--card)),var(--card));text-align:center}
.phase-hero.phase-dating{--phase-accent:var(--purple)}
.phase-hero.phase-weddings{--phase-accent:#b68419}
.phase-hero.phase-reunion{--phase-accent:var(--wine)}
.phase-hero-kicker{display:block;margin-bottom:7px;color:var(--phase-accent);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.phase-hero h2{margin:0;color:var(--wine);font:700 clamp(29px,5vw,40px)/1.05 'Playfair Display',Georgia,serif}
.phase-hero-rule{display:flex;align-items:center;justify-content:center;gap:10px;width:min(260px,70%);margin:12px auto 9px;color:#c59a35}
.phase-hero-rule::before,.phase-hero-rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#d9b85e)}
.phase-hero-rule::after{background:linear-gradient(90deg,#d9b85e,transparent)}
.phase-hero-rule span{font-size:14px}
.phase-hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.season-progress-scale,.season-progress-row{display:grid;grid-template-columns:minmax(88px,126px) 1fr;gap:10px;align-items:center}
.season-progress-scale{margin:13px 0 8px}
.season-progress-phases,.season-progress-track{display:flex;min-width:0}
.season-progress-phase{min-width:0;text-align:center;color:var(--soft-text);font-size:8px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.season-progress-row{padding:8px 0;border-top:1px solid var(--line)}
.season-progress-name{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.season-progress-track{position:relative;height:12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.season-progress-segment{min-width:0;border-right:1px solid color-mix(in srgb,var(--wine) 18%,transparent)}
.season-progress-segment:last-child{border-right:none}
.season-progress-segment:nth-child(1){background:color-mix(in srgb,var(--rose) 13%,transparent);border-radius:999px 0 0 999px}
.season-progress-segment:nth-child(2){background:color-mix(in srgb,var(--gold) 14%,transparent)}
.season-progress-segment:nth-child(3){background:color-mix(in srgb,var(--wine) 10%,transparent)}
.season-progress-segment:nth-child(4){background:color-mix(in srgb,var(--muted) 10%,transparent);border-radius:0 999px 999px 0}
.season-progress-marker{position:absolute;top:50%;width:20px;height:20px;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%;background:var(--wine);color:#fff;border:2px solid var(--card);box-shadow:0 2px 7px rgba(67,17,39,.25);font-size:9px;line-height:1}
.season-progress-status{grid-column:2;color:var(--muted);font-size:10.5px;line-height:1.25;margin-top:-5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px;margin:14px 0;box-shadow:0 9px 25px rgba(110,31,59,.055)}
.phase-board{--phase-accent:var(--rose);position:relative;border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,color-mix(in srgb,var(--phase-accent) 68%,#fff),color-mix(in srgb,var(--purple) 44%,var(--line))) border-box;box-shadow:0 12px 30px color-mix(in srgb,var(--phase-accent) 8%,transparent)}
.phase-board-dating{--phase-accent:var(--purple)}
.phase-board-weddings{--phase-accent:#b68419}
.phase-board-reunion{--phase-accent:var(--wine)}
.board-window-title{display:flex;align-items:center;gap:8px;margin:0 0 5px!important;color:var(--phase-accent)!important;font:800 10px/1.3 Inter,sans-serif!important;letter-spacing:.12em;text-transform:uppercase}
.board-window-title::before{content:"";width:22px;height:1px;background:currentColor}
#pool-panel-play{position:relative;isolation:isolate}
#pool-panel-play::before,#pool-panel-play::after{content:"";position:absolute;z-index:-1;pointer-events:none;filter:blur(2px);opacity:.62}
#pool-panel-play::before{left:-180px;top:230px;width:360px;height:560px;background:radial-gradient(ellipse at center,rgba(255,153,197,.36),rgba(255,205,225,.16) 47%,transparent 72%)}
#pool-panel-play::after{right:-190px;top:360px;width:370px;height:570px;background:radial-gradient(ellipse at center,rgba(174,124,249,.27),rgba(217,190,255,.12) 48%,transparent 72%)}
.card h2{font-family:'Playfair Display',Georgia,serif;color:var(--wine);font-size:23px;margin:0 0 4px}
.card h3{font-family:'Playfair Display',Georgia,serif;color:var(--wine);font-size:18px;margin:0 0 8px}
.lede{color:var(--muted);font-size:14px;line-height:1.55;margin:4px 0 0}
.btn-primary{display:block;width:100%;padding:15px 18px;margin-top:14px;border:none;border-radius:14px;color:#fff;font-weight:700;font-size:16px;font-family:Inter,sans-serif;cursor:pointer;background:linear-gradient(135deg,#d90068,#ed0c72 55%,#f4378f);box-shadow:0 10px 26px rgba(220,0,99,.24);transition:filter .15s,transform .1s}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn-secondary{display:block;width:100%;padding:13px 18px;margin-top:10px;border:1.5px solid var(--wine);border-radius:14px;color:var(--wine);font-weight:700;font-size:15px;font-family:Inter,sans-serif;cursor:pointer;background:none}
.btn-secondary:hover{background:var(--blush-soft)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 18px;margin-top:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;font-family:Inter,sans-serif;cursor:pointer;transition:box-shadow .15s,transform .1s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn-google:hover{box-shadow:0 4px 16px rgba(0,0,0,.13)}
.btn-google:active{transform:translateY(1px)}
.btn-add{padding:11px 16px;border:1.5px solid var(--wine);border-radius:12px;background:none;color:var(--wine);font-weight:700;font-size:14px;cursor:pointer;font-family:Inter,sans-serif}
.btn-add:disabled{opacity:.35;cursor:default}
.btn-confirm{border:none;color:#fff;background:linear-gradient(135deg,#d90068,#ed0c72 55%,#f4378f);box-shadow:0 7px 18px rgba(220,0,99,.2);transition:filter .15s,transform .1s}
.btn-confirm:hover{filter:brightness(1.06)}
.btn-confirm:active{transform:translateY(1px)}
.btn-confirm:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn-x{display:grid;place-items:center;flex:0 0 auto;min-width:44px;min-height:44px;border:none;background:none;color:#b08d95;font-size:16px;cursor:pointer;padding:8px}
.btn-small{padding:7px 14px;border:1.5px solid var(--wine);border-radius:10px;background:none;color:var(--wine);font-weight:700;font-size:13px;cursor:pointer;font-family:Inter,sans-serif}
.btn-small.filled{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn-small:disabled{opacity:.35;cursor:default}
.budget-card{--budget-accent:var(--rose);position:relative;margin:14px 0 10px;padding:15px 16px 14px 54px;border:1px solid color-mix(in srgb,var(--budget-accent) 26%,var(--line));border-radius:15px;background:linear-gradient(125deg,color-mix(in srgb,var(--budget-accent) 6%,var(--surface)),var(--surface));box-shadow:0 6px 18px color-mix(in srgb,var(--budget-accent) 7%,transparent)}
.budget-card.phase-dating{--budget-accent:var(--purple)}
.budget-card.phase-weddings{--budget-accent:#b68419}
.budget-card.phase-reunion{--budget-accent:var(--wine)}
.budget-card::before{content:"♥";position:absolute;left:15px;top:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--budget-accent) 12%,var(--card));color:var(--budget-accent);font:700 16px/1 Georgia,serif}
.budget-card.expiring{border-color:#d88923;background:color-mix(in srgb,#fff2d9 55%,var(--surface))}
.budget-card.carrying{border-color:color-mix(in srgb,var(--budget-accent) 34%,var(--line))}
.budgetrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.budgetrow .n{font-family:'Playfair Display',serif;font-size:22px;color:var(--wine)}
.budget-bar{height:10px;border-radius:999px;background:var(--blush-soft);overflow:hidden}
.budget-fill{height:100%;background:linear-gradient(90deg,var(--budget-accent),color-mix(in srgb,var(--budget-accent) 44%,#fff));transition:width .25s}
.budget-note{display:block;margin-top:7px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.02em}
.budget-card.expiring .budget-note{color:#8a5511}
.scoring-primer{margin:10px 0;padding:11px 13px;border:1px dashed color-mix(in srgb,var(--gold) 65%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--gold) 8%,var(--surface));color:var(--muted);font-size:12px;line-height:1.5}
.scoring-primer b{color:var(--wine)}
.guided-pick{margin:12px 0;padding:13px 14px;border:1px solid color-mix(in srgb,var(--rose) 42%,var(--line));border-radius:12px;background:linear-gradient(135deg,var(--blush-soft),var(--surface))}
.guided-pick-kicker{color:var(--rose);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.guided-pick p{margin:4px 0 0;color:var(--ink);font-size:13px;line-height:1.5}
.panel{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--surface)}
.phead{width:100%;text-align:left;background:var(--blush-soft);border:none;padding:12px 14px;font-weight:700;color:var(--wine);cursor:pointer;font-size:14px;font-family:Inter,sans-serif;display:flex;justify-content:space-between}
.pbody{padding:12px 14px;font-size:14px;line-height:1.6;color:var(--ink)}
.pbody ul{margin:6px 0;padding-left:18px}
.pbody li{margin:4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.field{flex:1;min-width:130px}
label.small{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--soft-text);display:block;margin-bottom:5px}
select,input[type=text],input[type=email]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:var(--ink);font-family:Inter,sans-serif}
input[type=range]{width:100%;accent-color:var(--rose)}
.stakebox{display:flex;align-items:center;gap:10px}
.stakeval{font-family:'Playfair Display',serif;font-size:24px;color:var(--wine);min-width:58px;text-align:center}
.points-preview{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.35}
.points-preview strong{color:var(--wine);font-family:'Playfair Display',Georgia,serif;font-size:15px;white-space:nowrap}
.pickchip{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:7px 0;background:var(--surface);text-align:left}
.pickchip>div{flex:1;min-width:0;text-align:left}
.pickchip .nm{font-weight:600;font-size:14px}
.locked-market-list{display:grid;gap:7px;margin:12px 0}
.locked-market{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--surface);color:var(--soft-text)}
.locked-market strong{color:var(--ink);font-size:14px}
.locked-market .lock-reason{text-align:right;font-size:12px}
.subtle{color:var(--soft-text);font-size:12px;line-height:1.45}
.results-group{margin:16px 0}
.results-group:first-of-type{margin-top:10px}
.results-group-title{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:'Playfair Display',Georgia,serif;font-size:20px}
.results-group-title.hits{color:#247344}
.results-group-title.misses{color:#a52c45}
.results-group-title.pending{color:#69559b}
.receipt{border-left:4px solid var(--gold);background:#fffaf1;padding:10px 13px;border-radius:0 10px 10px 0;margin:8px 0;font-variant-numeric:tabular-nums}
.receipt.miss{border-left-color:#c8576d;background:#fff0f2}
.receipt.pending{border-left-color:#b9a7dc;background:#f6f3fb}
.receipt.hit,.receipt.hit.pending{border-left-color:#3f9360;background:#edf8f1}
.receipt.hit .pts,.receipt.hit.pending .pts{color:#247344}
.receipt.retro{border-left-color:#7b2ee5;background:#f7f1ff}
.receipt .who{font-weight:700;font-size:14px}
.receipt .pts{float:right;font-family:'Playfair Display',serif;font-size:19px;color:var(--wine)}
.receipt.miss .pts{color:var(--miss);font-size:15px}
.math{font-size:12.5px;color:var(--muted);margin-top:3px;clear:both}
.other-outcomes{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.other-outcomes summary{cursor:pointer;color:var(--soft-text);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.other-outcomes-list{display:grid;gap:6px;margin-top:9px}
.outcome-compact{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:color-mix(in srgb,var(--surface) 86%,var(--blush-soft));color:var(--muted);font-size:11.5px;line-height:1.4}
.outcome-compact strong{color:var(--ink);font-size:12px}
.evt{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:linear-gradient(180deg,#fff,#fdf5f6)}

  reportClientError: data => {

    const report={
      uid:user.uid,

      code:cleanClientErrorValue(data?.code,80),
      appBuild:cleanClientErrorValue(data?.appBuild,160),
      occurrenceCount:increment(1),
      lastAt:serverTimestamp(),

    CLIENT_ERROR_CONTEXT_KEYS.forEach(key=>{report[key]=cleanClientErrorValue(data?.[key]);});
    return setDoc(doc(db,'clientErrors',user.uid,'categories',category),report,{merge:true});
  },
  leavePool: poolId => httpsCallable(functions,'leavePool')({poolId}),
  deleteMyAccount: () => httpsCallable(functions,'deleteMyAccount')({}),
  openGlobalPool: seasonId => httpsCallable(functions,'openGlobalPool')({seasonId}),
  acceptInvite: async (invite, uid) => {
    await runTransaction(db, async tx => {
      const inviteRef = doc(db,'invites',invite.id);
      const poolRef = doc(db,'pools',invite.poolId);
      const [inviteSnap,poolSnap] = await Promise.all([tx.get(inviteRef),tx.get(poolRef)]);
      if (!inviteSnap.exists() || inviteSnap.data().status !== 'pending') throw new Error('This invitation is no longer available.');
      if (!poolSnap.exists()) throw new Error('This pool is no longer available.');
      if (poolSnap.data().membershipClosed===true) throw new Error('This pool is locked for new players.');
      tx.update(poolRef, {members: arrayUnion(uid)});
      tx.update(inviteRef, {status:'accepted'});
    });
  },
  watchPoolActivity: (poolId,onChange,onError=()=>{}) => {
    const subscribe=reference=>{
      let firstSnapshot=true;
      return onSnapshot(reference,()=>{
        if(firstSnapshot){firstSnapshot=false;return;}
        onChange();
      },onError);
    };
    const stopPlayers=subscribe(collection(db,'pools',poolId,'players'));
    const stopStatuses=subscribe(collection(db,'pools',poolId,'phaseStatus'));
    const stopCastRatings=subscribe(collection(db,'pools',poolId,'castRatings'));
    return ()=>{stopPlayers();stopStatuses();stopCastRatings();};
  },
  setPoolMembershipClosed: async (poolId, uid, closed) => runTransaction(db, async tx => {
    const poolRef=doc(db,'pools',poolId);
    const poolSnap=await tx.get(poolRef);
    if(!poolSnap.exists()) throw new Error('This pool is no longer available.');
    const pool=poolSnap.data();
    if(pool.global===true) throw new Error('The Global Pool is always open.');
    if(pool.ownerUid!==uid) throw new Error('Only the pool owner can change who may join.');
    tx.update(poolRef,{
      membershipClosed:closed===true,
      membershipUpdatedAt:Date.now(),
      ...(closed===true?{membershipClosedAt:Date.now()}:{membershipClosedAt:null})
    });

  renamePool: async (poolId,uid,name) => runTransaction(db,async tx=>{
    const poolRef=doc(db,'pools',poolId),poolSnap=await tx.get(poolRef);
    if(!poolSnap.exists()||poolSnap.data().ownerUid!==uid||poolSnap.data().global===true)throw new Error('Only the pool owner can rename this pool.');
    tx.update(poolRef,{name:String(name||'').trim().slice(0,100),nameUpdatedAt:Date.now()});

  declineInvite: (inviteId) => updateDoc(doc(db,'invites',inviteId), {status:'declined'}),
  deletePool: pool => httpsCallable(functions,'deletePool')({poolId:pool.id}),
  savePlayer: async (poolId, uid, data) => {
    const batch = writeBatch(db);
    const {picks={},predictionPhases,skipPickWriteFor=[],lockPicks={}, ...publicState} = data;
    // Public status never contains picks. Replacing the document also removes legacy embedded picks.
    batch.set(doc(db,'pools',poolId,'players',uid), {...publicState,picks:deleteField()},{merge:true});
    const activePhase = GAME_PHASES.includes(publicState.phase) ? publicState.phase : 'pods';
    const editablePhases=Array.isArray(predictionPhases)
      ? [...new Set(predictionPhases.filter(phase=>GAME_PHASES.includes(phase)))]
      : [activePhase];
    // A completed player checkpoint is immutable. Its picks were saved when the
    // player locked them, so close/final-screen saves update only public status.
    editablePhases.filter(phase=>!skipPickWriteFor.includes(phase)).forEach(phase=>{
      if (publicState.completed?.[phase]) return;
      const lockedAt=Number(lockPicks[phase]);
      const pickState={
        uid,phase,picks:Array.isArray(picks[phase])?picks[phase]:[],
        updatedAt:Number.isFinite(lockedAt)?lockedAt:Date.now()
      };
      if(Number.isFinite(lockedAt))pickState.lockedAt=lockedAt;
      batch.set(
        doc(db,'pools',poolId,'phasePicks',phase+'__'+uid),
        pickState
      );
    });
    await batch.commit();
  },
  completePhase: async (poolId, phase, uid) => runTransaction(db, async tx => {
    const poolRef = doc(db,'pools',poolId);
    const statusRef = doc(db,'pools',poolId,'phaseStatus',phase);
    const [poolSnap,statusSnap] = await Promise.all([tx.get(poolRef),tx.get(statusRef)]);
    if (!poolSnap.exists() || !poolSnap.data().members.includes(uid)) throw new Error('You are not a member of this pool.');
    const completedMembers = [...new Set([...(statusSnap.exists()?statusSnap.data().completedMembers||[]:[]),uid])];
    // Every player follows their own streaming schedule. Checkpoints therefore
    // stay live and provisional as later players finish them.
    const nextStatus={completedMembers,updatedAt:Date.now()};
    // Replace the status document so deprecated fields cannot survive a lock.
    tx.set(statusRef,nextStatus);
    return nextStatus;
  }),
  lockGlobalPicks: (poolId,phases) => httpsCallable(functions,'openGlobalPool')({action:'lockGlobalPicks',poolId,phases}),
  completeGlobalPhase: (poolId,phase) => httpsCallable(functions,'openGlobalPool')({action:'completeGlobalPhase',poolId,phase}),
  advanceGlobalWatch: (poolId,watchedThrough) => httpsCallable(functions,'openGlobalPool')({action:'advanceGlobalWatch',poolId,watchedThrough}),
  resetHistoricalGlobalSimulation: poolId => httpsCallable(functions,'openGlobalPool')({action:'resetHistoricalSimulation',poolId}),
  loadGlobalStandings: async poolId => {

  loadMyPlayer: async (poolId,uid) => {
    const playerSnapshot=await getDoc(doc(db,'pools',poolId,'players',uid));
    if(!playerSnapshot.exists())return null;
    const player={...playerSnapshot.data(),picks:{pods:[],dating:[],weddings:[],reunion:[]}};
    await Promise.all(GAME_PHASES.map(async phase=>{
      const pickSnapshot=await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+uid));
      if(pickSnapshot.exists())player.picks[phase]=Array.isArray(pickSnapshot.data().picks)?pickSnapshot.data().picks:[];
    }));
    return player;
  },
  reopenPhase: (poolId, phase) => httpsCallable(functions,'reopenPhase')({poolId,phase}),
  loadAllPlayers: async (poolId, currentUid, globalPool=false) => {
    const toPlayer = d => {
      const {picks:legacyPicks={},...publicState}=d.data();
      return {...publicState,picks:{
        pods:Array.isArray(legacyPicks.pods)?legacyPicks.pods:[],
        dating:Array.isArray(legacyPicks.dating)?legacyPicks.dating:[],
        weddings:Array.isArray(legacyPicks.weddings)?legacyPicks.weddings:[],
        reunion:Array.isArray(legacyPicks.reunion)?legacyPicks.reunion:[],
      }};
    };
    const players = {};
    const status = {};
    try {
      const snap = await getDocs(collection(db,'pools',poolId,'players'));
      snap.docs.forEach(d => { players[d.id]=toPlayer(d); });
    } catch (e) {
      // Older rules may permit a player to read only their own record.
      console.warn('Loading this player’s record only.', e);
      if (currentUid) {
        const own = await getDoc(doc(db,'pools',poolId,'players',currentUid));
        if (own.exists()) players[currentUid]=toPlayer(own);
      }
    }
    await Promise.all(GAME_PHASES.map(async phase => {
      try {
        const statusSnap = await getDoc(doc(db,'pools',poolId,'phaseStatus',phase));
        if (statusSnap.exists()) status[phase] = statusSnap.data();
        const phaseStatusData = statusSnap.exists() ? statusSnap.data() : null;
        const completedMembers=phaseStatusData?.completedMembers||[];
        const viewerCompleted=completedMembers.includes(currentUid);
        if (viewerCompleted && completedMembers.length) {
          // Live checkpoints use only immutable picks belonging to players who
          // individually locked them. In friend pools, those picks stay hidden
          // until the viewer completes the same phase.
          await Promise.all(completedMembers.map(async uid => {
            if(!players[uid]) return;
            try {
              const lockedPick=await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+uid));
              if(lockedPick.exists())players[uid].picks[phase]=Array.isArray(lockedPick.data().picks)?lockedPick.data().picks:[];
            } catch(e) {
              // Older pools may have this player's locked picks only in the
              // legacy player document. Keep that fallback instead of failing
              // the entire Global leaderboard because one new-format document
              // is unavailable.
              console.warn('A locked prediction could not be loaded; using legacy prediction data when available.',e);
            }
          }));
        } else if (phase==='reunion') {
          // Reunion scores can be shown as soon as an individual player locks.
          // Other locked players' picks are readable only after the viewer has
          // locked too. Until then, fetch the viewer's own pick document only.
          let viewerPick=null;
          if(currentUid) {
            const viewerPickSnap=await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+currentUid));
            if(viewerPickSnap.exists()) {
              viewerPick=viewerPickSnap.data();
              if(players[currentUid])players[currentUid].picks[phase]=Array.isArray(viewerPick.picks)?viewerPick.picks:[];
            }
          }
          const viewerLocked=!!currentUid&&(phaseStatusData?.completedMembers?.includes(currentUid) ||
            Number.isFinite(Number(viewerPick?.lockedAt)));
          const pickUids=viewerLocked?Object.entries(players)
            .filter(([uid,p]) => phaseStatusData?.completedMembers?.includes(uid) ||
              (p.phase==='reunion' && ['watch','close','final'].includes(p.screen)))
            .map(([uid])=>uid).filter(uid=>uid!==currentUid):[];
          await Promise.all(pickUids.map(async uid => {
            try {
              const lockedPick = await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+uid));
              if (lockedPick.exists() && players[uid]) players[uid].picks[phase]=Array.isArray(lockedPick.data().picks)?lockedPick.data().picks:[];
            } catch (e) { console.warn('A Reunion prediction could not be loaded yet.', e); }
          }));
        } else if (currentUid && players[currentUid]) {
          const own = await getDoc(doc(db,'pools',poolId,'phasePicks',phase+'__'+currentUid));
          if (own.exists()) players[currentUid].picks[phase]=Array.isArray(own.data().picks)?own.data().picks:[];
        }
      } catch (e) {
        if(['permission-denied','firestore/permission-denied'].includes(e?.code))throw e;
        console.warn('New phase storage is not available for this pool yet.', e);
      }
    }));
    return {players, status};
  },
  getUsers: async (uids) => {
    const out = {};
    await Promise.all(uids.map(async u => {
      try {
        const s = await getDoc(doc(db,'users',u));
        if (s.exists()) out[u] = s.data();

        console.warn('A player profile could not be loaded.', e);

    return out;

  getGlobalPool: async (seasonId) => {

  joinGlobalPool: async (season,uid,rulesSnapshot) => {

    await httpsCallable(functions,'openGlobalPool')({seasonId:season.id});
    const s=await getDoc(ref);
    if(!s.exists())throw new Error('The Global Pool could not be opened.');
    return {id:s.id,...s.data()};
  },
  getPlayer: async (poolId,uid) => {
    const s=await getDoc(doc(db,'pools',poolId,'players',uid));
    return s.exists()?s.data():null;
  },
  loadMyCastRatings: async (seasonId,uid) => {
    const snapshot=await getDoc(doc(db,'castRatingProfiles',uid,'seasons',seasonId));
    return snapshot.exists()?snapshot.data():null;
  },
  loadCastRatingCommunity: async (poolId,seasonId,globalPool=false) => {
    if(globalPool) {
      const snapshot=await getDoc(doc(db,'castRatingAggregates',seasonId));
      return {kind:'global',aggregate:snapshot.exists()?snapshot.data():null};
    }
    const snapshot=await getDocs(collection(db,'pools',poolId,'castRatings'));
    return {
      kind:'friends',
      entries:snapshot.docs.map(item=>({uid:item.id,...item.data()})).filter(entry=>entry.shared===true&&Array.isArray(entry.ratings)),
    };
  },
  saveCastRatings: async ({poolId,seasonId,uid,username,ratings,shareWithFriends,globalPool=false}) => {
    const safeRatings=cleanCastRatings(ratings);
    const profileRef=doc(db,'castRatingProfiles',uid,'seasons',seasonId);
    if(globalPool) {
      // The trusted aggregate trigger observes globalRatings and updates the
      // anonymous community totals. Browsers never write aggregate documents.
      await setDoc(profileRef,{
        seasonId,ratings:safeRatings,globalRatings:safeRatings,updatedAt:Date.now(),
      },{merge:true});
    } else {
      const communityRef=doc(db,'pools',poolId,'castRatings',uid);
      const batch=writeBatch(db);
      batch.set(profileRef,{seasonId,ratings:safeRatings,updatedAt:Date.now()},{merge:true});
      batch.set(communityRef,shareWithFriends===true
        ? {uid,username:String(username||'Player').slice(0,40),shared:true,ratings:safeRatings,updatedAt:Date.now()}
        : {uid,shared:false,updatedAt:Date.now()});
      await batch.commit();
    }
    return {seasonId,ratings:safeRatings,updatedAt:Date.now()};
  },
  savePhasePicks: (poolId,phase,uid,picks) => setDoc(
    doc(db,'pools',poolId,'phasePicks',phase+'__'+uid),{uid,phase,picks:Array.isArray(picks)?picks:[],updatedAt:Date.now()}
  ),
  syncMirroredProgress: (poolId,uid,confirmedWatch) => runTransaction(db,async transaction=>{
    const playerRef=doc(db,'pools',poolId,'players',uid);
    const playerSnapshot=await transaction.get(playerRef);
    if(!playerSnapshot.exists())throw new Error('Open the linked Global Pool before syncing watch progress.');
    const player=playerSnapshot.data();
    const requested=Math.max(0,Math.trunc(Number(confirmedWatch)||0));
    const w=Math.max(Math.max(0,Number(player.w)||0),requested);
    const watchThrough=Math.max(Math.max(0,Number(player.watchThrough)||0),w);
    transaction.update(playerRef,{w,watchThrough});
    return {w,watchThrough};
  }),
  syncMirroredCompletion: (poolId,uid,phase,confirmedWatch) => runTransaction(db,async transaction=>{
    const playerRef=doc(db,'pools',poolId,'players',uid);
    const playerSnapshot=await transaction.get(playerRef);
    if(!playerSnapshot.exists())throw new Error('Open the linked pool before syncing phase completion.');
    const player=playerSnapshot.data();
    const requested=Math.max(0,Math.trunc(Number(confirmedWatch)||0));
    const w=Math.max(Math.max(0,Number(player.w)||0),requested);
    const watchThrough=Math.max(Math.max(0,Number(player.watchThrough)||0),w);
    const completed={...(player.completed||{}),[phase]:true};
    transaction.update(playerRef,{
      w,watchThrough,completed,
      ...(player.phase===phase?{screen:'close'}:{}),
    });
    return {w,watchThrough,completed,screen:player.phase===phase?'close':player.screen};
  }),
  clearMirrorSource: (poolId,uid) => setDoc(
    doc(db,'pools',poolId,'players',uid),{duplicateFromPoolId:deleteField()},{merge:true}
  ),
};
window.dispatchEvent(new Event('firebase-ready'));
</script>

<script type="text/babel" data-presets="react">
const initialAppParams=new URLSearchParams(window.location.search);
const APP_BUILD_TIMESTAMP='__APP_BUILD_TIMESTAMP__'.startsWith('__APP_')?'development source · '+document.lastModified:'__APP_BUILD_TIMESTAMP__';
window.__TTW_DIAGNOSTICS__={appBuildTimestamp:APP_BUILD_TIMESTAMP};
const MARKETING_CREATE_INTENT=initialAppParams.get('start')==='create';
// Emergency/admin-only diagnostic path. Player traffic must use the same
// published Firestore snapshot as Cloud Functions.
const ADMIN_SEASON_SHEET_FALLBACK=initialAppParams.get('adminSeasonSource')==='sheet';
const trackTtwEvent=(event,details={})=>window.ttwAnalytics?.track(event,details);
const ERROR_CONTEXT_KEYS=['entryStep','operation','phase','poolId','screen','seasonId','targetPoolId'];
const safeErrorContextValue=(value,maxLength=100)=>String(value||'').replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim().slice(0,maxLength);
const reportTtwError=(category,error,context={})=>{
  const code=safeErrorContextValue(error?.code||error?.name||'unknown',80)||'unknown';
  const safeContext=Object.fromEntries(ERROR_CONTEXT_KEYS.map(key=>[key,safeErrorContextValue(context[key])]).filter(([,value])=>value));
  trackTtwEvent('app_error',{category,code,operation:safeContext.operation||'',phase:safeContext.phase||'',screen:safeContext.screen||''});
  try{
    const report=window._fb?.reportClientError?.({category,code,appBuild:APP_BUILD_TIMESTAMP,...safeContext});
    if(report?.catch)report.catch(()=>{});
  }catch(reportError){}
};
/* MIRROR ENTRY HELPERS START */
const syncMirroredPicksOnEntry=async({phases,savePhasePicks,onSkipped=()=>{}})=>{
  await Promise.all(phases.map(async phase=>{
    try{await savePhasePicks(phase);}
    catch(error){onSkipped(phase,error);}
  }));
};
const syncMirroredTargetProgress=async({poolId,uid,confirmedWatch,globalTarget,advanceGlobalWatch,syncPublicProgress})=>{
  if(globalTarget)await advanceGlobalWatch(poolId,confirmedWatch);
  return syncPublicProgress(poolId,uid,confirmedWatch);
};
const syncMirroredPhaseCompletion=async({poolId,uid,phase,picks,globalTarget,lockGlobalPicks,completeGlobalPhase,completeFriendPhase,syncPublicCompletion,confirmedWatch})=>{
  if(globalTarget){
    const lockResult=await lockGlobalPicks(poolId,{[phase]:picks});
    const accepted=lockResult?.data?.accepted;
    if(!accepted||Number(accepted[phase])!==picks.length)throw new Error('The linked Global Pool did not accept every prediction before closing the checkpoint.');
    await completeGlobalPhase(poolId,phase);
    return lockResult?.data||null;
  }
  await completeFriendPhase(poolId,phase,uid);
  return syncPublicCompletion(poolId,uid,phase,confirmedWatch);
};
const unavailableMirrorSourceError=()=>Object.assign(
  new Error('The mirrored source pool no longer exists or is no longer available to this player.'),
  {code:'not-found'},
);
const loadMirrorSourceState=async({poolId,uid,loadAllPlayers,getPool})=>{
  let source;
  try{
    source=await loadAllPlayers(poolId,uid,false);
  }catch(loadError){
    // A deleted pool can make subcollection reads look like a permissions
    // failure. Probe the pool itself before deciding whether to detach it.
    // If the pool still exists for this member, preserve the link and surface
    // the real read error instead of misreporting it as a deletion.
    let sourcePool;
    try{sourcePool=await getPool(poolId);}
    catch(probeError){throw loadError;}
    if(!sourcePool||!Array.isArray(sourcePool.members)||!sourcePool.members.includes(uid))throw unavailableMirrorSourceError();
    throw loadError;
  }
  const player=source.players?.[uid]||null;
  if(player)return {player,status:source.status||{},empty:false};
  const sourcePool=await getPool(poolId);
  if(!sourcePool||!Array.isArray(sourcePool.members)||!sourcePool.members.includes(uid))throw unavailableMirrorSourceError();
  // New pools do not have a player document until they are opened. They are
  // still valid mirror sources: start both games empty and retain the link so
  // the first source save can synchronize into the target.
  return {player:null,status:source.status||{},empty:true};
};
const linkedMirrorPeers=(links,poolId)=>{
  const peerIds=[];
  (Array.isArray(links)?links:[]).forEach(link=>{
    if(link?.sourcePoolId===poolId&&link.poolId)peerIds.push(link.poolId);
    else if(link?.poolId===poolId&&link.sourcePoolId)peerIds.push(link.sourcePoolId);
  });
  return [...new Set(peerIds)].filter(peerId=>peerId&&peerId!==poolId).map(peerId=>({poolId:peerId}));
};

const clampWatchTarget=(phase,currentWatch,requestedWatch,spans,availableThrough)=>{
  const current=Number.isFinite(Number(currentWatch))?Number(currentWatch):0;
  const requested=Number.isFinite(Number(requestedWatch))?Number(requestedWatch):current;
  const phaseEnd=Number(spans?.[phase]?.endEp);
  const available=Number(availableThrough);
  const ceiling=Math.min(
    Number.isFinite(phaseEnd)?phaseEnd:current,
    Number.isFinite(available)?available:current,
  );
  // Never pretend someone has not watched an episode they already confirmed.
  // Only pending or future progress is constrained when availability moves back.
  return Math.max(current,Math.min(requested,ceiling));
};

function ErrorScrollManager() {
  const lastError=useRef({node:null,text:''});
  useEffect(()=>{
    const root=document.getElementById('root');
    if(!root)return;
    let frame=0;
    const revealLatestError=()=>{
      cancelAnimationFrame(frame);
      frame=requestAnimationFrame(()=>{
        const visibleErrors=[...root.querySelectorAll('[role="alert"]')].filter(node=>{
          const style=window.getComputedStyle(node);
          return style.display!=='none'&&style.visibility!=='hidden'&&node.getClientRects().length>0;
        });
        const error=visibleErrors.at(-1);
        if(!error)return;
        const text=error.textContent?.trim()||'';
        if(lastError.current.node===error&&lastError.current.text===text)return;
        lastError.current={node:error,text};
        if(!error.hasAttribute('tabindex'))error.setAttribute('tabindex','-1');
        error.scrollIntoView({behavior:'auto',block:'center',inline:'nearest'});
        error.focus({preventScroll:true});
      });
    };
    const observer=new MutationObserver(revealLatestError);
    observer.observe(root,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['role']});
    revealLatestError();
    return()=>{cancelAnimationFrame(frame);observer.disconnect();};
  },[]);
  return null;
}

  </div>;
}
function ChemistryPreview() {
  const globalPool=new URLSearchParams(window.location.search).get('chemistryPreview')==='global';
  const cast=[
    {name:'AD',gender:'F',photoUrl:'images/cast/love-is-blind-us-6/AD.webp'},
    {name:'Amy',gender:'F',photoUrl:'images/cast/love-is-blind-us-6/Amy.webp'},
    {name:'Chelsea',gender:'F',photoUrl:'images/cast/love-is-blind-us-6/Chelsea.webp'},
    {name:'Clay',gender:'M',photoUrl:'images/cast/love-is-blind-us-6/Clay.webp'},
    {name:'Jimmy',gender:'M',photoUrl:'images/cast/love-is-blind-us-6/Jimmy.webp'},
    {name:'Johnny',gender:'M',photoUrl:'images/cast/love-is-blind-us-6/Johnny.webp'},
  ];
  const demoPlayers=[
    {uid:'demo-me',username:'You'},
    {uid:'demo-maya',username:'Maya'},
    {uid:'demo-lex',username:'Lex'},
    {uid:'demo-priya',username:'Priya'},
    {uid:'demo-ben',username:'Ben'},
    {uid:'demo-sofia',username:'Sofia'},
    {uid:'demo-marcus',username:'Marcus'},
    {uid:'demo-jules',username:'Jules'},
  ];
  const scorecards=demoPlayers.map((player,playerIndex)=>({
    ...player,
    shared:true,
    ratings:cast.map((person,index)=>({
      name:person.name,
      gender:person.gender,
      flag:index===0&&playerIndex<6?'red':index===1&&playerIndex<5?'green':'',
      values:{
        hotness:(6+index+playerIndex)%11,
        humour:(8+index*2+playerIndex)%11,
        intelligence:(9+index+playerIndex*2)%11,
        vibes:(5+index*3+playerIndex)%11,
      },
    })),
  }));
  const aggregate={
    participantCount:scorecards.length,
    updatedAt:1,
    cast:cast.map(person=>{
      const ratings=scorecards.map(card=>card.ratings.find(rating=>rating.name===person.name));
      const totals={},counts={};
      RATING_CATEGORIES.forEach(category=>{
        totals[category.id]=ratings.reduce((sum,rating)=>sum+rating.values[category.id],0);counts[category.id]=ratings.length;
      });
      totals.overall=ratings.reduce((sum,rating)=>sum+overallRating(rating.values),0);counts.overall=ratings.length;
      totals.redFlag=ratings.reduce((sum,rating)=>sum+(rating.flag==='red'?1:0),0);counts.redFlag=totals.redFlag;
      totals.greenFlag=ratings.reduce((sum,rating)=>sum+(rating.flag==='green'?1:0),0);counts.greenFlag=totals.greenFlag;
      return {name:person.name,gender:person.gender,totals,counts};
    }),
  };
  const [mine,setMine]=useState({ratings:scorecards[0].ratings,updatedAt:1});
  const [community,setCommunity]=useState(globalPool?{kind:'global',aggregate,loadedAt:1}:{kind:'friends',entries:scorecards,loadedAt:1});
  const [feedback,setFeedback]=useState('');
  const savePreview=(ratings,shareWithFriends)=>{
    const updatedAt=Date.now();
    setMine({ratings,updatedAt});
    if(!globalPool)setCommunity(current=>({...current,entries:[
      ...current.entries.filter(entry=>entry.uid!=='demo-me'),
      ...(shareWithFriends?[{uid:'demo-me',username:'You',shared:true,ratings}]:[]),
    ],loadedAt:updatedAt}));
    setFeedback(globalPool?'Saved privately and added to the global averages.':'Ratings saved.');
  };
  const closePreview=()=>{const url=new URL(window.location.href);url.searchParams.delete('chemistryPreview');window.location.assign(url.toString());};
  return <div className="app">
    <BrandHeader season={globalPool?'Love Is Blind UK: Season 3':'Love Is Blind US: Season 6'}><h1>{globalPool?'Global Pool':'Pod Squad'}</h1></BrandHeader>
    <button type="button" className="btn-small" style={{width:'auto',marginBottom:12}} onClick={closePreview}>← Back to app demo</button>
    <ChemistryPanel eng={{CAST:cast}} seasonId="chemistry-preview" poolName="Pod Squad" globalPool={globalPool} currentUid="demo-me" myRatingDoc={mine} community={community} globalCommunity={{kind:'global',aggregate,loadedAt:1}} memberLabels={{'demo-me':'You','demo-maya':'Maya','demo-lex':'Lex'}} onSave={savePreview} saving={false} feedback={feedback} onRefresh={()=>setFeedback('Preview refreshed.')} panelLabelledBy={null}/>
  </div>;
}
function Sel({label,value,onChange,options,placeholder}) {

function StakeSlider({value,onChange,max,multiplier=1,pointsPerHeart=1,previewNote='before clock and grain bonuses'}) {
  const id=useId();

  const preview=Math.round(safeValue*multiplier*pointsPerHeart);

}

function PodsBoard({w,picks,add,remove,spent,eng,finalWindow,onPendingChange,pendingRef}) {
  const {MEN,WOMEN,COUPLES,RULES,nameOf,membOf,coupleFor,pairKeyFor,personKey,leadM,fmt}=eng;
  const [him,setHim]=useState(''),[her,setHer]=useState(''),[stake,setStake]=useState(30);
  const [adding,setAdding]=useState(picks.length===0);
  const engaged=new Set(COUPLES.filter(c=>c.podsEligible&&Number.isFinite(c.engagedEp)&&c.engagedEp<=w).flatMap(c=>[c.him,c.her]).map(personKey));
  const used=new Set(picks.flatMap(p=>membOf(p.c)).map(personKey));
  const predictedPairs=new Set(picks.map(p=>pairKeyFor(p.c)));
  const pairAvailable=(man,woman)=>{
    if(!man||!woman)return true;
    const pairKey=pairKeyFor(man+'|'+woman);
    return !predictedPairs.has(pairKey);
  };
  const menA=MEN.filter(n=>!engaged.has(personKey(n))&&!used.has(personKey(n))&&pairAvailable(n,her));
  const womA=WOMEN.filter(n=>!engaged.has(personKey(n))&&!used.has(personKey(n))&&pairAvailable(him,n));
  const left=RULES.phases.pods.budget-spent, maxS=Math.min(RULES.phases.pods.cap,left);
  const doAdd=()=>{add({c:him+'|'+her,s:Math.min(stake,maxS),w});setHim('');setHer('');setAdding(false);};
  const startAnother=()=>{setHim('');setHer('');setAdding(true);};
  const predictionInProgress=adding&&(him||her);
  const skipPrediction=useCallback(()=>{setHim('');setHer('');setAdding(false);},[]);
  pendingRef.current=skipPrediction;
  useEffect(()=>{onPendingChange(!!predictionInProgress);return()=>onPendingChange(false);},[predictionInProgress,onPendingChange]);
  const predictionStatus=p=>{
    const couple=coupleFor(p.c);
    return couple&&Number.isFinite(couple.engagedEp)&&couple.engagedEp<=w
      ? 'Resolved in Episode '+couple.engagedEp
      : 'Locked after Episode '+p.w+' · Against-the-Clock x'+fmt(leadM(w-p.w))+' if they propose next episode';
  };
  const firstPick=picks.length===0;
  return <div className="card phase-board phase-board-pods"><h2 className="board-window-title">Your Pods predictions</h2><p className="lede"><b>Prediction window: after Episode {w}, before Episode {w+1}.</b> {finalWindow?<React.Fragment><b>This is your last chance to use your Pods Hearts.</b> Any left after this window are lost.</React.Fragment>:'You can spend some, all, or none of your remaining Hearts now. Any Hearts you keep will remain available in later Pods prediction windows.'}</p><Budget phase="pods" spent={spent} RULES={RULES} finalWindow={finalWindow}/>
    {firstPick&&<div className="guided-pick"><div className="guided-pick-kicker">Your first prediction</div><p>Choose one pair, decide how many Hearts you believe in them, then confirm. That’s all you need to start; the Rules tab is here whenever you want the full details.</p></div>}
    {adding&&<React.Fragment><div className="row"><Sel label="Him" value={him} onChange={setHim} options={menA}/><Sel label="Her" value={her} onChange={setHer} options={womA}/></div><div className="row"><StakeSlider value={stake} onChange={setStake} max={maxS} pointsPerHeart={RULES.POINTS_PER_HEART} previewNote="minimum before bonuses"/><button className="btn-add btn-confirm" disabled={!him||!her||!pairAvailable(him,her)||left<5} onClick={doAdd}>Confirm prediction</button></div></React.Fragment>}
    {picks.length>0&&<React.Fragment><hr className="divider"/>{picks.map((p,i)=><div className="pickchip" key={i}><div><div className="nm">{nameOf(p.c)} - {p.s}♥</div><div className="subtle">{predictionStatus(p)}</div></div>{p.w===w&&<button className="btn-x" onClick={()=>remove(i)} aria-label={'Remove prediction for '+nameOf(p.c)}>✕</button>}</div>)}{!adding&&left>=5&&<button className="btn-primary" style={{marginTop:14}} onClick={startAnother}>+ Make Another Prediction</button>}</React.Fragment>}
  </div>;
}
function DatingBoard({w,picks,add,remove,spent,eng,finalWindow}) {
  const {COUPLES,RULES,DATING_RESULTS,PH_SPAN,PH_STARTW,DATING_MULT,nameOf,fmt,leadM,personKey,flirtResultFor}=eng;
  const open=w>=PH_STARTW.dating&&w<PH_SPAN.dating.retreatEndEp;
  const left=RULES.phases.dating.budget-spent, maxS=Math.min(RULES.phases.dating.cap,left);
  const [bC,setBC]=useState(''),[bS,setBS]=useState(20);
  const [sC,setSC]=useState(''),[sS,setSS]=useState(20);
  const [fP,setFP]=useState(''),[fS,setFS]=useState(20);
  const retreatCouples=COUPLES.filter(c=>c.datingEligible&&(!Number.isFinite(c.engagedEp)||c.engagedEp<=w));
  const bO=retreatCouples.filter(c=>!(DATING_RESULTS.breakup[c.id]&&DATING_RESULTS.breakup[c.id].ep<=w)&&!picks.some(p=>p.m==='breakup'&&p.c===c.id));
  const sO=retreatCouples.filter(c=>!(DATING_RESULTS.sex[c.id]&&DATING_RESULTS.sex[c.id].ep<=w)&&!picks.some(p=>p.m==='sex'&&p.c===c.id));
  const fO=retreatCouples.flatMap(c=>[c.him,c.her]).filter((person,index,people)=>people.indexOf(person)===index&&!(flirtResultFor(person)&&flirtResultFor(person).ep<=w)&&!picks.some(p=>p.m==='flirt'&&personKey(p.p)===personKey(person)));
  const opt=l=>l.map(c=>({v:c.id,t:nameOf(c.id)}));
  const ml=p=>p.m==='breakup'?'Breaks up during the retreat':(p.m==='sex'?'Sleep together':FLIRT_SHORT);
  const resultFor=p=>p.m==='flirt'?flirtResultFor(p.p):DATING_RESULTS[p.m]?.[p.c];
  const predictionStatus=p=>{
    const result=resultFor(p);
    if(result?.ep<=w) return 'Resolved in Episode '+result.ep+' · Against-the-Clock x'+fmt(leadM(Math.max(0,result.ep-p.w-1)));
    return p.w===w?'editable until you start Episode '+(w+1):'Locked after Episode '+p.w+' · predicting before you see it coming';
  };
  return <div className="card phase-board phase-board-dating"><h2 className="board-window-title">{open?'Your Retreats predictions':'Retreats predictions locked'}</h2><p className="lede">{open?<React.Fragment><b>Prediction window: after Episode {w}, before Episode {w+1}.</b> {finalWindow?<React.Fragment><b>This is your last chance to use your Retreats Hearts.</b> Any left after this window are lost.</React.Fragment>:'Spend some, all, or none now. Hearts you keep remain available in later Retreats windows, and earlier picks earn more for predicting before you see the outcome coming.'}</React.Fragment>:'The retreat scoring window has ended.'}</p><Budget phase="dating" spent={spent} RULES={RULES} finalWindow={finalWindow}/>
    {open&&<React.Fragment>
    <div className="mkt-title"><h3>Who breaks up during the retreat?</h3><span className="multpill">x{fmt(DATING_MULT.breakup)}</span></div><p className="subtle">Both members of the couple must clearly understand that their relationship is over.</p><div className="row"><Sel label="Couple" value={bC} onChange={setBC} options={opt(bO)}/><StakeSlider value={bS} onChange={setBS} max={maxS} multiplier={DATING_MULT.breakup} pointsPerHeart={RULES.POINTS_PER_HEART}/><button className="btn-add" disabled={!bC||left<5} onClick={()=>{add({m:'breakup',c:bC,s:Math.min(bS,maxS),w});setBC('');}}>Add prediction</button></div>
    <hr className="divider"/><div className="mkt-title"><h3>Who sleeps together on the retreat?</h3><span className="multpill">x{fmt(DATING_MULT.sex)}</span></div><p className="subtle">Must be explicitly stated or very clearly implied.</p><div className="row"><Sel label="Couple" value={sC} onChange={setSC} options={opt(sO)}/><StakeSlider value={sS} onChange={setSS} max={maxS} multiplier={DATING_MULT.sex} pointsPerHeart={RULES.POINTS_PER_HEART}/><button className="btn-add" disabled={!sC||left<5} onClick={()=>{add({m:'sex',c:sC,s:Math.min(sS,maxS),w});setSC('');}}>Add prediction</button></div>
    <hr className="divider"/><div className="mkt-title"><h3>{FLIRT_SHORT}</h3><span className="multpill">x{fmt(DATING_MULT.flirt)}</span></div><p className="subtle">Who inappropriately flirts with or expresses interest directly to someone other than their fiancé(e) during the retreat? The moment must be shown, clearly implied, or explicitly discussed on camera during the retreat.</p><div className="row"><Sel label="Person" value={fP} onChange={setFP} options={fO}/><StakeSlider value={fS} onChange={setFS} max={maxS} multiplier={DATING_MULT.flirt} pointsPerHeart={RULES.POINTS_PER_HEART}/><button className="btn-add" disabled={!fP||left<5} onClick={()=>{add({m:'flirt',p:fP,s:Math.min(fS,maxS),w});setFP('');}}>Add prediction</button></div>
    </React.Fragment>}
    {picks.length>0&&<hr className="divider"/>}{picks.map((p,i)=><div className="pickchip" key={i}><div><div className="nm">{p.m==='flirt'?p.p:nameOf(p.c)} - {ml(p)} - {p.s}♥</div><div className="subtle">{predictionStatus(p)}</div></div>{open&&p.w===w&&<button className="btn-x" onClick={()=>remove(i)} aria-label={'Remove prediction for '+(p.m==='flirt'?p.p:nameOf(p.c))}>✕</button>}</div>)}</div>;
}
function WeddingsBoard({w,picks,add,remove,spent,eng,finalWindow}) {
  const {COUPLES,RULES,PH_SPAN,PH_STARTW,WED_MULT,nameOf,membOf,whoNm,fmt,weddingLeadM,weddingMarketState,eligibleForWeddings}=eng;
  const phaseOpen=w<PH_SPAN.weddings.endEp;
  const left=RULES.phases.weddings.budget-spent, maxS=Math.min(RULES.phases.weddings.cap,left);
  const [cid,setCid]=useState(''),[answer,setAnswer]=useState(''),[when,setWhen]=useState(''),[whoT,setWhoT]=useState(''),[stake,setStake]=useState(40);
  const exhausted=phaseOpen&&left<=0;
  const listed=COUPLES.filter(c=>c.wedding!=='notShown'&&Number.isFinite(c.weddingEligibleFromEp)&&c.weddingEligibleFromEp<=w);
  const alive=listed.filter(c=>eligibleForWeddings(c,w)&&!picks.some(p=>p.c===c.id));
  const locked=listed.filter(c=>!eligibleForWeddings(c,w));
  const lockedReason=c=>Number.isFinite(c.settledEp)&&c.settledEp<=w?'Outcome settled in Episode '+c.settledEp:weddingMarketState(c,w).reason;
  const open=phaseOpen&&!exhausted&&alive.length>0;
  const outcome=answer==='yes'?'married':(answer==='no'&&when==='before'?'calledOff':(answer==='no'&&when==='altar'?'saysNo':''));
  const previewMultiplier=answer==='yes'?WED_MULT.married:(outcome?WED_MULT[outcome]*(1+RULES.WHO_TAG):1);
  const previewNote=answer==='no'&&outcome?'if timing and person are right, before clock and grain':'before clock and grain bonuses';
  const pickWindow=p=>Number.isFinite(p.w)?p.w:PH_STARTW.weddings;
  const predictionStatus=p=>{
    const c=eng.coupleFor(p.c), resultEp=c&&(c.settledEp||PH_SPAN.weddings.endEp);
    const market=c&&weddingMarketState(c,w);
    if(market&&!market.open) return market.reason;
    if(!Number.isFinite(p.w)) return 'Locked before rolling Wedding windows — no Against-the-Clock bonus';
    if(c?.wedding&&resultEp<=w) return 'Resolved in Episode '+resultEp+' · Against-the-Clock x'+fmt(weddingLeadM(Math.max(0,resultEp-p.w-1)));
    return 'Locked after Episode '+p.w+' · Against-the-Clock is now at least x'+fmt(weddingLeadM(Math.max(0,w-p.w)));
  };
  const title=exhausted?'You have no more Hearts for predictions':open?'Wedding predictions after Episode '+w:'Wedding markets locked';
  return <div className={'card phase-board phase-board-weddings'+(exhausted?' exhausted-board':'')}><h2 className="board-window-title">{title}</h2><p className="lede">{exhausted?'Your existing predictions and every couple whose window has passed remain visible below.':open?<React.Fragment><b>Prediction window: after Episode {w}, before Episode {w+1}.</b> {finalWindow?<React.Fragment><b>This is your last chance to use your Weddings Hearts.</b> Any left after this window are lost.</React.Fragment>:'You can spend some, all, or none of your remaining Hearts now. Any Hearts you keep will remain available in later Weddings prediction windows.'}</React.Fragment>:phaseOpen?'Every currently listed couple has reached its individual Wedding lock episode.':'The Weddings phase has closed.'}</p><Budget phase="weddings" spent={spent} RULES={RULES} finalWindow={finalWindow}/><p className="subtle" style={{margin:'4px 0 0'}}>{picks.length} prediction{picks.length===1?'':'s'} placed · {alive.length} open · {locked.length} locked</p>
    {open&&<React.Fragment>
    <div className="row"><Sel label="Couple" value={cid} onChange={v=>{setCid(v);setAnswer('');setWhen('');setWhoT('');}} options={alive.map(c=>({v:c.id,t:nameOf(c.id)}))}/><Sel label="Do they get married?" value={answer} onChange={v=>{setAnswer(v);setWhen('');setWhoT('');}} options={[{v:'yes',t:'Yes (x'+fmt(WED_MULT.married)+')'},{v:'no',t:'No'}]}/></div>
    {answer==='no'&&cid&&<React.Fragment><div className="row"><Sel label="When?" value={when} onChange={setWhen} options={[{v:'before',t:'Before the altar (x'+fmt(WED_MULT.calledOff)+' bonus)'},{v:'altar',t:'At the altar (x'+fmt(WED_MULT.saysNo)+' bonus)'}]}/><Sel label="Who ends it?" value={whoT} onChange={setWhoT} options={[{v:'him',t:membOf(cid)[0]},{v:'her',t:membOf(cid)[1]}]}/></div></React.Fragment>}
    <div className="row"><StakeSlider value={stake} onChange={setStake} max={maxS} multiplier={previewMultiplier} pointsPerHeart={RULES.POINTS_PER_HEART} previewNote={previewNote}/><button className="btn-add" disabled={!cid||!answer||left<5||(answer==='no'&&(!when||!whoT))} onClick={()=>{add({c:cid,o:outcome,...(answer==='no'?{who:whoT}:{}),s:Math.min(stake,maxS),w});setCid('');setAnswer('');setWhen('');setWhoT('');}}>Add prediction</button></div>
    </React.Fragment>}
    {locked.length>0&&<React.Fragment><hr className="divider"/><div className="mkt-title"><h3>Locked couples</h3><span className="multpill">{locked.length}</span></div><div className="locked-market-list">{locked.map(c=><div className="locked-market" key={c.id}><strong>{nameOf(c.id)}</strong><span className="lock-reason">{lockedReason(c)}</span></div>)}</div></React.Fragment>}
    {picks.length>0&&<hr className="divider"/>}{picks.map((p,i)=>{const c=eng.coupleFor(p.c),market=c&&weddingMarketState(c,w);return <div className="pickchip" key={i}><div><div className="nm">{nameOf(p.c)} - {WED_LABEL[p.o]}{p.who?' ('+whoNm(p.c,p.who)+')':''} - {p.s}♥</div><div className="subtle">{predictionStatus(p)}</div></div>{phaseOpen&&!exhausted&&market?.open&&pickWindow(p)===w&&<button className="btn-x" onClick={()=>remove(i)} aria-label={'Remove prediction for '+nameOf(p.c)}>✕</button>}</div>;})}</div>;
}
function ReunionBoard({w,picks,add,remove,spent,eng}) {
  const {MEN,WOMEN,COUPLES,RULES,PH_SPAN,PH_STARTW,REU_MULT,RESULTS_READY,nameOf,reunionPickLabel,reunionRelationshipGroup,fmt,personKey,pairKeyFor}=eng;
  const open=w>=PH_STARTW.reunion&&w<PH_SPAN.reunion.endEp;
  const left=RULES.phases.reunion.budget-spent, maxS=Math.min(RULES.phases.reunion.cap,left);
  const AC=[...new Set(COUPLES.flatMap(c=>[c.him,c.her]))].sort(alphaByName);
  const married=COUPLES.filter(c=>reunionRelationshipGroup(c)==='married').map(c=>c.id);
  const split=COUPLES.filter(c=>reunionRelationshipGroup(c)==='split').map(c=>c.id);
  const knownDating=COUPLES.filter(c=>reunionRelationshipGroup(c)==='knownDating').map(c=>c.id);
  const knownPairKeys=new Set(COUPLES.map(c=>pairKeyFor(c.id)));
  const [relC,setRelC]=useState(''),[relO,setRelO]=useState(''),[relS,setRelS]=useState(20);
  const [nH,setNH]=useState(''),[nW,setNW]=useState(''),[nS,setNS]=useState(20);
  const [lP,setLP]=useState(''),[lU,setLU]=useState(''),[lS,setLS]=useState(20);
  const [aP,setAP]=useState(''),[aS,setAS]=useState(20);
  const relationshipAvailable=id=>!picks.some(p=>relationshipOutcome(p)&&p.c===id);
  const newCoupleAvailable=(him,her)=>{
    const pairKey=pairKeyFor(him+'|'+her);
    return !knownPairKeys.has(pairKey)&&!picks.some(p=>p.m==='newCouple'&&pairKeyFor(p.pair)===pairKey);
  };
  const lifeUpdateAvailable=(person,update)=>!picks.some(p=>p.m==='lifeUpdate'&&personKey(p.person)===personKey(person)&&normalizeLifeUpdate(p.update)===normalizeLifeUpdate(update));
  const absentAvailable=person=>!picks.some(p=>p.m==='absent'&&personKey(p.person)===personKey(person));
  const relationshipCouples=[...new Set([...married,...split,...knownDating])];
  const relationshipOptions=relationshipCouples.filter(relationshipAvailable).map(id=>({v:id,t:nameOf(id)}));
  const relationshipAnswers=married.includes(relC)
    ? [{v:'still',t:'Still together (x'+fmt(REU_MULT.still)+')'},{v:'marriedSplit',t:'Broken up since marrying (x'+fmt(REU_MULT.marriedSplit)+')'}]
    : (knownDating.includes(relC)
      ? [{v:'still',t:'Still together (x'+fmt(REU_MULT.still)+')'},{v:'split',t:'No longer together (x'+fmt(REU_MULT.split)+')'}]
      : (split.includes(relC)?[{v:'back',t:'Back together (x'+fmt(REU_MULT.back)+')'}]:[]));
  const relationshipPreviewMultiplier=REU_MULT[relO]||1;
  const relationshipMultipliers=[REU_MULT.still,REU_MULT.split,REU_MULT.marriedSplit,REU_MULT.back];
  const relationshipMultiplierRange='×'+fmt(Math.min(...relationshipMultipliers))+'–×'+fmt(Math.max(...relationshipMultipliers));
  const newCoupleMen=MEN.filter(person=>!nW||newCoupleAvailable(person,nW));
  const newCoupleWomen=WOMEN.filter(person=>!nH||newCoupleAvailable(nH,person));
  const lifeUpdatePeople=AC.filter(person=>!lU||lifeUpdateAvailable(person,lU));
  const lifeUpdateOptions=Object.entries(LIFE_UPD).filter(([update])=>!lP||lifeUpdateAvailable(lP,update)).map(([v,t])=>({v,t}));
  const absentPeople=AC.filter(absentAvailable);
  const ml=reunionPickLabel;
  return <div className="card phase-board phase-board-reunion"><h2 className="board-window-title">{open?'Your Reunion predictions':'Reunion predictions locked'}</h2><p className="lede">{open&&<React.Fragment><b>Prediction window: after Episode {w}, before Episode {w+1}.</b> </React.Fragment>}Choose any combination of categories. Each prediction uses Hearts separately, and you may leave categories empty. Unspent Hearts are lost when you lock — this is your only Reunion window.</p><Budget phase="reunion" spent={spent} RULES={RULES} finalWindow/>{!RESULTS_READY.weddings&&<div className="notice" style={{marginTop:12}}><b>Wedding outcomes are still being confirmed.</b> Back-together options will appear once a resolved, non-married outcome is available.</div>}
    {open&&<React.Fragment>
    <div className={'reunion-market'+(relationshipCouples.length?'':' reunion-market-muted')}><div className="reunion-market-head"><div><h3>Where are they now?</h3><span className="reunion-market-caption">One relationship-status prediction per known couple</span></div><div className="reunion-market-multiplier" aria-label={'Multiplier range '+relationshipMultiplierRange}><strong>{relationshipMultiplierRange}</strong><span>by answer</span></div></div>{relationshipOptions.length?<React.Fragment><div className="row"><Sel label="Couple" value={relC} onChange={value=>{setRelC(value);setRelO('');}} options={relationshipOptions}/><Sel label="Reunion status" value={relO} onChange={setRelO} options={relationshipAnswers}/></div><div className="row"><StakeSlider value={relS} onChange={setRelS} max={maxS} multiplier={relationshipPreviewMultiplier} pointsPerHeart={RULES.POINTS_PER_HEART} previewNote="before Against-the-Grain"/><button className="btn-add" disabled={!relC||!relO||!relationshipAvailable(relC)||left<5} onClick={()=>{add({m:'relationship',c:relC,outcome:relO,s:Math.min(relS,maxS)});setRelC('');setRelO('');}}>Add prediction</button></div></React.Fragment>:<p className="subtle">{relationshipCouples.length?'You have already predicted every eligible couple.':'Relationship-status options will appear after wedding outcomes are confirmed.'}</p>}</div>
    <div className="reunion-market"><div className="reunion-market-head"><div><h3>New couple revealed</h3><span className="reunion-market-caption">A pairing first revealed at the Reunion</span></div><div className="reunion-market-multiplier" aria-label={'Multiplier x'+fmt(REU_MULT.newCouple)}><strong>×{fmt(REU_MULT.newCouple)}</strong><span>multiplier</span></div></div><div className="row"><Sel label="Him" value={nH} onChange={setNH} options={newCoupleMen}/><Sel label="Her" value={nW} onChange={setNW} options={newCoupleWomen}/></div><div className="row"><StakeSlider value={nS} onChange={setNS} max={maxS} multiplier={REU_MULT.newCouple} pointsPerHeart={RULES.POINTS_PER_HEART} previewNote="before Against-the-Grain"/><button className="btn-add" disabled={!nH||!nW||!newCoupleAvailable(nH,nW)||left<5} onClick={()=>{add({m:'newCouple',pair:nH+'|'+nW,s:Math.min(nS,maxS)});setNH('');setNW('');}}>Add prediction</button></div></div>
    <div className="reunion-market"><div className="reunion-market-head"><div><h3>Major life update</h3><span className="reunion-market-caption">A significant castmate update</span></div><div className="reunion-market-multiplier" aria-label={'Multiplier x'+fmt(REU_MULT.lifeUpdate)}><strong>×{fmt(REU_MULT.lifeUpdate)}</strong><span>multiplier</span></div></div><div className="row"><Sel label="Castmate" value={lP} onChange={setLP} options={lifeUpdatePeople}/><Sel label="Update" value={lU} onChange={setLU} options={lifeUpdateOptions}/></div><div className="row"><StakeSlider value={lS} onChange={setLS} max={maxS} multiplier={REU_MULT.lifeUpdate} pointsPerHeart={RULES.POINTS_PER_HEART} previewNote="before Against-the-Grain"/><button className="btn-add" disabled={!lP||!lU||!lifeUpdateAvailable(lP,lU)||left<5} onClick={()=>{add({m:'lifeUpdate',person:lP,update:lU,s:Math.min(lS,maxS)});setLP('');setLU('');}}>Add prediction</button></div></div>
    <div className="reunion-market"><div className="reunion-market-head"><div><h3>Absent castmate</h3><span className="reunion-market-caption">Not present at the Reunion</span></div><div className="reunion-market-multiplier" aria-label={'Multiplier x'+fmt(REU_MULT.absent)}><strong>×{fmt(REU_MULT.absent)}</strong><span>multiplier</span></div></div><div className="row"><Sel label="Castmate" value={aP} onChange={setAP} options={absentPeople}/><StakeSlider value={aS} onChange={setAS} max={maxS} multiplier={REU_MULT.absent} pointsPerHeart={RULES.POINTS_PER_HEART} previewNote="before Against-the-Grain"/><button className="btn-add" disabled={!aP||!absentAvailable(aP)||left<5} onClick={()=>{add({m:'absent',person:aP,s:Math.min(aS,maxS)});setAP('');}}>Add prediction</button></div></div>
    </React.Fragment>}
    {picks.length>0&&<hr className="divider"/>}{picks.map((p,i)=><div className="pickchip" key={i}><div className="nm">{ml(p)} - {p.s}♥</div>{open&&<button className="btn-x" onClick={()=>remove(i)} aria-label={'Remove prediction: '+ml(p)}>✕</button>}</div>)}</div>;
}

function ScoreProgressChart({phases, ranked, phaseTotals, RULES, playerName, hasRetro=false, valuesAreCumulative=false,animated=false}) {
  if (!phases.length || !ranked.length) return null;
  const width=560, height=210, margin={top:18,right:12,bottom:40,left:42};
  const plotWidth=width-margin.left-margin.right, plotHeight=height-margin.top-margin.bottom;
  const scoreText=n=>String(+Number(n).toFixed(2));
  const colourOrder=ranked.slice().sort();
  const colourFor=id=>{
    const index=colourOrder.indexOf(id);
    return `hsl(${Math.round((332+index*137.508)%360)} 66% 53%)`;
  };
  const series=ranked.map(id=>{
    let running=0;
    const values=phases.map(ph=>{
      if(valuesAreCumulative)return phaseTotals[ph][id]||0;
      running+=phaseTotals[ph][id]||0;
      return running;
    });
    return {id,name:playerName(id),values,color:colourFor(id)};
  });
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const x=index=>phases.length===1 ? margin.left+plotWidth/2 : margin.left+index*(plotWidth/(phases.length-1));
  const y=value=>margin.top+plotHeight-(value/max)*plotHeight;
  const linePath=values=>values.map((value,index)=>(index?'L':'M')+x(index).toFixed(1)+' '+y(value).toFixed(1)).join(' ');
  const ticks=[0,0.5,1];
  return <section className={'score-trend'+(animated?' animated':'')} aria-labelledby="score-trend-title">
    <h3 id="score-trend-title">Score by phase</h3>
    <p className="score-trend-note">Cumulative points after each completed phase.{hasRetro?' Totals include retroactive changes not shown in this chart.':''}</p>
    <svg className="score-chart" viewBox={'0 0 '+width+' '+height} role="img" aria-label="Cumulative score by phase for each player">
      <title>Score progression by phase</title>
      <desc>{series.map(s=>s.name+' ends with '+scoreText(s.values[s.values.length-1])+' points').join('. ')}</desc>
      {ticks.map(t=>{const value=max*t,py=y(value);return <g key={t}><line className="score-chart-grid" x1={margin.left} x2={width-margin.right} y1={py} y2={py}/><text className="score-chart-axis" x={margin.left-8} y={py+3} textAnchor="end">{scoreText(value)}</text></g>;})}
      <text className="score-chart-axis" x="12" y={margin.top+plotHeight/2} transform={'rotate(-90 12 '+(margin.top+plotHeight/2)+')'} textAnchor="middle">Points</text>
      {phases.map((phase,index)=><text className="score-chart-phase" key={phase} x={x(index)} y={height-12} textAnchor="middle">{RULES.phases[phase].label}</text>)}
      {series.map((s,seriesIndex)=><g key={s.id}><path className="score-series" d={linePath(s.values)} style={{stroke:s.color,animationDelay:(seriesIndex*.18)+'s'}}/>{s.values.map((value,index)=><circle className="score-point" style={{animationDelay:(seriesIndex*.18+index*.32+.35)+'s'}} key={index} cx={x(index)} cy={y(value)} r="4" fill={s.color}><title>{s.name+', '+RULES.phases[phases[index]].label+': '+scoreText(value)+' points'}</title></circle>)}</g>)}
    </svg>
    <div className="score-legend" aria-label="Player score legend">{series.map(s=><span className="score-legend-item" key={s.id}><span className="score-legend-swatch" style={{backgroundColor:s.color}}></span><span>{s.name} <span className="score-legend-total">{scoreText(s.values[s.values.length-1])}</span></span></span>)}</div>
  </section>;
}
const drawPodiumShareCard=(ctx,options)=>{
  const podium=options.podium||[];
  drawReceiptBackground(ctx,1080,1080);drawReceiptBrand(ctx,{x:115,y:126,scale:.8});
  ctx.textAlign='center';ctx.fillStyle='#f3c553';ctx.font='900 23px Inter,Arial,sans-serif';ctx.letterSpacing='5px';ctx.fillText(options.finalized?'FINAL PODIUM':'LIVE PODIUM',540,285);ctx.letterSpacing='0px';
  ctx.fillStyle='#fffaf7';ctx.font='700 69px Georgia,serif';ctx.fillText(options.poolName||'Through the Wall',540,372);
  ctx.fillStyle='#f1d7e4';ctx.font='700 23px Inter,Arial,sans-serif';ctx.fillText(options.seasonLabel||'',540,415);

const uniqueWrappedTitle=(category,id,candidates=[])=>{
  const titles=wrappedSuperlatives[category]||[];
  if(!titles.length)return '';
  const index=candidates.slice().sort((a,b)=>String(a).localeCompare(String(b))).indexOf(id);
  return titles[(index<0?0:index)%titles.length];
};
const derivePlayerAwards=({phaseEntries={},phaseMembers={},scoredPhases=[],phaseTotals={},ranked=[],rankById={},includeWrappedSuperlatives=false})=>{
  const ids=[...new Set(scoredPhases.flatMap(phase=>phaseMembers[phase]||[]))],awards=Object.fromEntries(ids.map(id=>[id,[]]));
  const hitIn=(id,phase)=>(phaseEntries[phase]||[]).some(entry=>entry.member===id&&entry.ok&&!entry.pending);
  ids.forEach(id=>{
    let hot=0,cold=0;
    for(let index=scoredPhases.length-1;index>=0;index--){if(hitIn(id,scoredPhases[index])){if(cold===0)hot++;else break;}else{if(hot===0)cold++;else break;}}
    if(hot>=2)awards[id].push({label:'🔥 '+hot+'-phase streak',tone:'gold'});
    if(cold>=2)awards[id].push({label:'🧊 Cold streak',tone:'purple'});
    if(hitIn(id,'weddings'))awards[id].push({label:'💍 Predicted the Wedding',tone:'gold'});
  });
  const addWrappedAward=(id,category,candidates,tone='gold')=>{
    const label=uniqueWrappedTitle(category,id,candidates);
    if(label)awards[id]?.unshift({label,tone});
  };
  if(includeWrappedSuperlatives&&ranked.length){
    const categoryById={};
    ranked.forEach(id=>{
      const rank=rankById[id]||ranked.length,total=ranked.length;
      categoryById[id]=rank===1?'champion':rank===total?'last_place':total>=3&&rank<=3?'podium':rank/total<=.4?'top_half':rank/total>.75?'bottom_half':'middle_of_pack';
    });
    Object.entries(categoryById).forEach(([id,category])=>addWrappedAward(id,category,ranked.filter(candidate=>categoryById[candidate]===category)));

    const settledEntries=scoredPhases.flatMap(phase=>phaseEntries[phase]||[]).filter(entry=>entry.member&&!entry.pending);
    const accuracy=Object.fromEntries(ids.map(id=>[id,{hits:0,total:0}]));
    settledEntries.forEach(entry=>{if(accuracy[entry.member]){accuracy[entry.member].total++;if(entry.ok)accuracy[entry.member].hits++;}});
    const eligibleAccuracy=ids.filter(id=>accuracy[id].total>=3);
    const bestAccuracy=Math.max(...eligibleAccuracy.map(id=>accuracy[id].hits/accuracy[id].total),-1);
    const accuracyWinners=eligibleAccuracy.filter(id=>accuracy[id].hits/accuracy[id].total===bestAccuracy);
    accuracyWinners.forEach(id=>addWrappedAward(id,'most_accurate',accuracyWinners,'purple'));

    const phaseRanks=[];const running=Object.fromEntries(ranked.map(id=>[id,0]));
    scoredPhases.forEach(phase=>{
      ranked.forEach(id=>{running[id]+=(phaseTotals[phase]?.[id]||0);});
      const ordered=ranked.slice().sort((a,b)=>running[b]-running[a]||String(a).localeCompare(String(b)));
      const ranks={};ordered.forEach((id,index)=>{ranks[id]=index>0&&running[id]===running[ordered[index-1]]?ranks[ordered[index-1]]:index+1;});
      phaseRanks.push(ranks);
    });
    if(phaseRanks.length>=2){
      const firstRanks=phaseRanks[0],finalRanks=rankById,minShift=Math.max(2,Math.ceil(ranked.length*.15));
      const comebackCandidates=ranked.filter(id=>(firstRanks[id]||ranked.length)-(finalRanks[id]||ranked.length)>=minShift);
      const bestComeback=Math.max(...comebackCandidates.map(id=>(firstRanks[id]||ranked.length)-(finalRanks[id]||ranked.length)),-1);
      const comebackWinners=comebackCandidates.filter(id=>(firstRanks[id]||ranked.length)-(finalRanks[id]||ranked.length)===bestComeback);
      comebackWinners.forEach(id=>addWrappedAward(id,'comeback',comebackWinners,'gold'));
      const fadeCandidates=ranked.filter(id=>(firstRanks[id]||ranked.length)<=Math.max(3,Math.ceil(ranked.length*.25))&&(finalRanks[id]||ranked.length)-(firstRanks[id]||ranked.length)>=minShift);
      const biggestFade=Math.max(...fadeCandidates.map(id=>(finalRanks[id]||ranked.length)-(firstRanks[id]||ranked.length)),-1);
      const fadeWinners=fadeCandidates.filter(id=>(finalRanks[id]||ranked.length)-(firstRanks[id]||ranked.length)===biggestFade);
      fadeWinners.forEach(id=>addWrappedAward(id,'early_leader_fade',fadeWinners,'purple'));

      const volatility={};
      // The biggest difference between any two phase scores is our stat-based
      // proxy for a player whose pool experience was pure chaos.
      ranked.forEach(id=>{
        const phaseScores=scoredPhases.map(phase=>phaseTotals[phase]?.[id]||0);
        volatility[id]=Math.max(...phaseScores)-Math.min(...phaseScores);
      });
      const wildest=Math.max(...ranked.map(id=>volatility[id]),0);
      const chaosWinners=ranked.filter(id=>wildest>0&&volatility[id]===wildest);
      chaosWinners.forEach(id=>addWrappedAward(id,'most_chaotic',chaosWinners,'purple'));
    }
  }
  const contrarian=[];scoredPhases.forEach(phase=>(phaseEntries[phase]||[]).forEach(entry=>{if(entry.ok&&!entry.pending&&entry.member&&Number(entry.owners)>0&&Number(entry.poolSize)>0)contrarian.push(entry);}));
  contrarian.sort((a,b)=>(a.owners/a.poolSize)-(b.owners/b.poolSize)||b.points-a.points);
  if(contrarian[0]?.member){
    if(includeWrappedSuperlatives)addWrappedAward(contrarian[0].member,'contrarian',[contrarian[0].member],'');
    else awards[contrarian[0].member]?.unshift({label:'✦ Most Contrarian',tone:''});
  }

};

    dating:{tagline:'Out of the pods and into the Retreats. Predict between episodes before you see the retreat outcomes coming.',rules:<ul><li>You get {RULES.phases.dating.budget} Hearts that you can spend until the cast leaves the retreat vacation. Predictions can only be made between episodes.</li><li>You do not have to spend all your Hearts in the current window. Unspent Hearts stay available until the retreat scoring window closes.</li><li>You lose any Hearts left when the retreat ends. Hearts never carry into another phase.</li><li>You win points if you correctly predict:<ul><li><b>Who breaks up during the retreat?</b> Choose any couples where the relationship ends on the retreat. Both members must clearly understand that the relationship is over.</li><li><b>Who sleeps together?</b> You may choose multiple couples; only moments referenced on camera during the retreat count.</li><li><b>Who inappropriately flirts with or expresses interest directly to someone other than their fiancé(e)?</b> Choose a person that flirts inappropriately. Only moments during the retreat count.</li></ul></li><li>Add predictions between episodes. Once you watch the next episode, those picks are locked.</li><li>Earlier correct picks earn more points than later ones.</li>{cfg.BOUNDARIES_FINAL?.dating!==false&&<li>Your last chance to make retreat predictions is after Episode {cfg.PH_SPAN.dating.retreatEndEp}.</li>}</ul>,scoring:<div><p><b>Points = Hearts wagered × Market Multiplier × Against-the-Clock Bonus × Against-the-Grain Bonus.</b></p><p><b>Market Multipliers:</b> Who sleeps together pays ×{cfg.fmt(cfg.DATING_MULT.sex)}, who inappropriately flirts pays ×{cfg.fmt(cfg.DATING_MULT.flirt)}, and who breaks up pays ×{cfg.fmt(cfg.DATING_MULT.breakup)}.</p><p><b>Against-the-Clock Bonus:</b> Your multiplier starts at ×1 when you make a correct prediction in the window immediately before it happens. Predict one episode earlier for ×{cfg.fmt(oneEpisodeClock)}, two episodes earlier for ×{cfg.fmt(twoEpisodeClock)}, and so on. This season's maximum is ×{cfg.fmt(maxDatingClock)}.</p><p><b>Against-the-Grain Bonus:</b> Only players who made predictions in this phase count toward this bonus. The bonus is ×1 if every active player made this prediction, and up to ×{cfg.fmt(soloGrain)} if all {cfg.POOL} players predict this phase and only you make this pick.</p><p><b>Maximum example for this {cfg.POOL}-player pool (if all {cfg.POOL} players predict this phase):</b> Wager 20 Hearts on a breakup, predict it two episodes early (×{cfg.fmt(twoEpisodeClock)}), and be the only player to predict it (×{cfg.fmt(soloGrain)}): 20 × {cfg.fmt(cfg.DATING_MULT.breakup)} × {cfg.fmt(twoEpisodeClock)} × {cfg.fmt(soloGrain)} = {datingExamplePoints} points.</p></div>},
